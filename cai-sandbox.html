<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceship Dodge Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #0a0a2e, #16213e, #1a1a2e);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 80, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 120, 120, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 255, 120, 0.05) 0%, transparent 50%);
            overflow: hidden;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            background: transparent;
        }

        #spaceship {
            position: fixed;
            bottom: 20px;
            left: 50%;
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #00ffff, #0080ff);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            transition: filter 0.3s ease, transform 0.3s ease;
            z-index: 10;
            margin-left: -20px;
        }

        .projectile {
            position: absolute;
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #ff4444, #ff8888);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.8);
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 15px rgba(255, 68, 68, 0.8); }
            to { box-shadow: 0 0 25px rgba(255, 68, 68, 1); }
        }

        #gameUI {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        #startScreen h1, #gameOverScreen h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        }

        #startScreen p, #gameOverScreen p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(45deg, #00ffff, #0080ff);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .btn:hover {
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            transform: scale(1.05);
        }

        #rail {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #333, #666, #333);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="rail"></div>
        <div id="spaceship"></div>
        
        <div id="gameUI">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
            <div id="orientationStatus">Tilt to move!</div>
        </div>

        <div id="startScreen">
            <h1>🚀 SPACESHIP DODGE</h1>
            <p>Tilt your device left and right to move your spaceship!<br>
            Avoid the falling projectiles to survive.<br><br>
            <small>📱 Mobile: Grant motion permission when prompted<br>
            💻 Desktop: Use arrow keys or A/D keys</small></p>
            <button class="btn" onclick="requestPermissionsAndStart()">START GAME</button>
        </div>

        <div id="gameOverScreen" style="display: none;">
            <h1>GAME OVER</h1>
            <p>Your Score: <span id="finalScore">0</span></p>
            <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Game configuration - easily adjustable
        const gameConfig = {
            initialSpawnRate: 0.005,      // Starting spawn rate (lower = fewer projectiles)
            spawnRateIncrease: 0.0001,    // How much spawn rate increases per frame
            maxSpawnRate: 0.03,           // Maximum spawn rate cap
            difficultyIncreaseRate: 0.0005 // How fast the game gets harder
        };

        let gameState = {
            isPlaying: false,
            score: 0,
            lives: 3,
            spaceshipX: 0,
            projectiles: [],
            gameSpeed: 2,
            spawnRate: gameConfig.initialSpawnRate,
            orientationSupported: false
        };

        const spaceship = document.getElementById('spaceship');
        const gameContainer = document.getElementById('gameContainer');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreElement = document.getElementById('finalScore');
        const orientationStatus = document.getElementById('orientationStatus');

        let containerWidth = window.innerWidth;
        let containerHeight = window.innerHeight;

        // Create starfield background
        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                gameContainer.appendChild(star);
            }
        }

        // Initialize spaceship position
        function initializeSpaceship() {
            containerWidth = window.innerWidth;
            containerHeight = window.innerHeight;
            gameState.spaceshipX = containerWidth / 2; // Center position
            updateSpaceshipPosition();
            
            // Force visibility
            spaceship.style.display = 'block';
            spaceship.style.visibility = 'visible';
        }

        // Update spaceship position
        function updateSpaceshipPosition() {
            const minX = 20; // Half spaceship width
            const maxX = containerWidth - 20; // Half spaceship width  
            gameState.spaceshipX = Math.max(minX, Math.min(maxX, gameState.spaceshipX));
            
            // Update position from center
            spaceship.style.left = gameState.spaceshipX + 'px';
            spaceship.style.marginLeft = '-20px'; // Center the ship
        }

        // Permission request function
        async function requestPermissionsAndStart() {
            orientationStatus.textContent = 'Requesting permissions...';
            
            try {
                // Check if we're on iOS and need to request permission
                if (typeof DeviceOrientationEvent !== 'undefined' && 
                    typeof DeviceOrientationEvent.requestPermission === 'function') {
                    
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        orientationStatus.textContent = 'Motion permission granted!';
                        gameState.orientationSupported = true;
                    } else {
                        orientationStatus.textContent = 'Motion permission denied - using keyboard';
                        gameState.orientationSupported = false;
                    }
                } else {
                    // For Android and other devices
                    orientationStatus.textContent = 'Setting up motion controls...';
                    gameState.orientationSupported = true;
                }
                
                // Small delay to show the status message
                setTimeout(() => {
                    startGame();
                }, 500);
                
            } catch (error) {
                console.log('Permission request failed:', error);
                orientationStatus.textContent = 'Using keyboard controls';
                gameState.orientationSupported = false;
                startGame();
            }
        }

        // Device orientation controls
        function handleOrientation(event) {
            if (!gameState.isPlaying || !gameState.orientationSupported) return;
            
            // Get gamma (left-right tilt)
            const gamma = event.gamma; // -90 to 90 degrees
            
            if (gamma === null || gamma === undefined) return;
            
            // Apply movement based on tilt
            const sensitivity = 5;
            const movement = gamma * sensitivity;
            
            gameState.spaceshipX += movement;
            updateSpaceshipPosition();
            
            // Show debug info
            orientationStatus.textContent = `Tilt: ${Math.round(gamma)}° | Score: ${gameState.score}`;
        }

        // Keyboard controls for desktop
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function handleKeyboardControls() {
            if (!gameState.isPlaying) return;
            
            const speed = 8;
            
            if (keys['arrowleft'] || keys['a']) {
                gameState.spaceshipX -= speed;
            }
            if (keys['arrowright'] || keys['d']) {
                gameState.spaceshipX += speed;
            }
            
            updateSpaceshipPosition();
        }

        // Projectile management
        function createProjectile() {
            const projectile = document.createElement('div');
            projectile.className = 'projectile';
            projectile.style.left = Math.random() * (containerWidth - 20) + 'px';
            projectile.style.top = '-20px';
            gameContainer.appendChild(projectile);
            
            gameState.projectiles.push({
                element: projectile,
                x: parseFloat(projectile.style.left),
                y: -20,
                speed: gameState.gameSpeed + Math.random() * 2
            });
        }

        function updateProjectiles() {
            for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
                const projectile = gameState.projectiles[i];
                projectile.y += projectile.speed;
                projectile.element.style.top = projectile.y + 'px';

                // Remove projectiles that are off screen
                if (projectile.y > containerHeight) {
                    projectile.element.remove();
                    gameState.projectiles.splice(i, 1);
                    gameState.score += 10;
                    continue;
                }

                // Collision detection with visual feedback
                if (checkCollision(projectile)) {
                    projectile.element.remove();
                    gameState.projectiles.splice(i, 1);
                    gameState.lives--;
                    
                    // Enhanced flash effect with red tint
                    spaceship.style.filter = 'brightness(0.3) sepia(1) hue-rotate(-50deg) saturate(3)';
                    spaceship.style.transform = 'scale(1.2)';
                    setTimeout(() => {
                        spaceship.style.filter = 'brightness(1)';
                        spaceship.style.transform = 'scale(1)';
                    }, 300);
                    
                    // Add screen shake effect
                    gameContainer.style.transform = 'translate(' + (Math.random() * 4 - 2) + 'px, ' + (Math.random() * 4 - 2) + 'px)';
                    setTimeout(() => {
                        gameContainer.style.transform = 'translate(0, 0)';
                    }, 100);
                    
                    if (gameState.lives <= 0) {
                        endGame();
                    }
                }
            }
        }

        function checkCollision(projectile) {
            // Get actual spaceship bounds (triangle shape considerations)
            const spaceshipRect = {
                x: gameState.spaceshipX - 15, // Slightly smaller hit area for fairness
                y: containerHeight - 55,      // Adjust for spaceship height
                width: 30,                    // Smaller than visual width (40px)
                height: 30                    // Smaller than visual height (40px)
            };

            // Projectile bounds (also slightly smaller)
            const projectileRect = {
                x: projectile.x + 2,          // Add small margin
                y: projectile.y + 2,          // Add small margin  
                width: 16,                    // Smaller than visual (20px)
                height: 16                    // Smaller than visual (20px)
            };

            // More precise collision detection with overlap threshold
            const overlapX = Math.max(0, Math.min(spaceshipRect.x + spaceshipRect.width, projectileRect.x + projectileRect.width) - Math.max(spaceshipRect.x, projectileRect.x));
            const overlapY = Math.max(0, Math.min(spaceshipRect.y + spaceshipRect.height, projectileRect.y + projectileRect.height) - Math.max(spaceshipRect.y, projectileRect.y));
            
            // Require significant overlap for collision (not just touching edges)
            const minOverlap = 8;
            return overlapX >= minOverlap && overlapY >= minOverlap;
        }

        // Game loop
        function gameLoop() {
            if (!gameState.isPlaying) return;

            handleKeyboardControls();

            // Spawn projectiles based on current spawn rate
            if (Math.random() < gameState.spawnRate) {
                createProjectile();
            }

            updateProjectiles();
            updateUI();

            // Gradually increase difficulty
            gameState.gameSpeed += gameConfig.difficultyIncreaseRate;
            
            // Increase spawn rate over time but cap it
            if (gameState.spawnRate < gameConfig.maxSpawnRate) {
                gameState.spawnRate += gameConfig.spawnRateIncrease;
            }

            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            scoreElement.textContent = gameState.score;
            livesElement.textContent = gameState.lives;
            
            // Show current difficulty (optional debug info)
            // orientationStatus.textContent = `Spawn Rate: ${(gameState.spawnRate * 1000).toFixed(1)}/1000`;
        }

        // Game state management
        function startGame() {
            gameState.isPlaying = true;
            gameState.score = 0;
            gameState.lives = 3;
            gameState.gameSpeed = 2;
            gameState.spawnRate = 0.02;
            gameState.projectiles = [];

            // Clear existing projectiles
            document.querySelectorAll('.projectile').forEach(p => p.remove());

            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            initializeSpaceship();
            updateUI();
            gameLoop();

            // Enhanced orientation setup
            setupOrientation();
        }

        function setupOrientation() {
            // Remove any existing listeners
            window.removeEventListener('deviceorientation', handleOrientation);
            
            if (gameState.orientationSupported) {
                // Add the orientation listener
                window.addEventListener('deviceorientation', handleOrientation, true);
                orientationStatus.textContent = 'Tilt to move!';
            } else {
                orientationStatus.textContent = 'Use arrow keys or A/D';
            }

            // Add touch support as backup
            let touchStartX = 0;
            let isTouching = false;

            gameContainer.addEventListener('touchstart', (e) => {
                if (!gameState.isPlaying) return;
                touchStartX = e.touches[0].clientX;
                isTouching = true;
            });

            gameContainer.addEventListener('touchmove', (e) => {
                if (!gameState.isPlaying || !isTouching) return;
                e.preventDefault();
                const touchX = e.touches[0].clientX;
                const deltaX = touchX - touchStartX;
                gameState.spaceshipX += deltaX * 0.8;
                updateSpaceshipPosition();
                touchStartX = touchX;
            });

            gameContainer.addEventListener('touchend', () => {
                isTouching = false;
            });
        }

        function endGame() {
            gameState.isPlaying = false;
            finalScoreElement.textContent = gameState.score;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            requestPermissionsAndStart();
        }

        // Initialize
        window.addEventListener('resize', () => {
            containerWidth = window.innerWidth;
            containerHeight = window.innerHeight;
            if (gameState.isPlaying) {
                updateSpaceshipPosition();
            }
        });

        // Create stars on load
        createStars();
        initializeSpaceship();
    </script>
</body>
</html>
