<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceship Dodge Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom, #0a0a2e, #16213e, #1a1a2e);
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 80%, rgba(120, 80, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 120, 120, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(120, 255, 120, 0.05) 0%, transparent 50%);
            overflow: hidden;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            background: transparent;
        }

        #spaceship {
            position: absolute;
            bottom: 20px;
            left: 50%;
            width: 40px;
            height: 40px;
            background: linear-gradient(45deg, #00ffff, #0080ff);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            transition: left 0.05s ease-out;
            z-index: 10;
            transform: translateX(-50%);
        }

        .projectile {
            position: absolute;
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #ff4444, #ff8888);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.8);
            animation: glow 1s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 15px rgba(255, 68, 68, 0.8); }
            to { box-shadow: 0 0 25px rgba(255, 68, 68, 1); }
        }

        #gameUI {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }

        #startScreen h1, #gameOverScreen h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
        }

        #startScreen p, #gameOverScreen p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            background: linear-gradient(45deg, #00ffff, #0080ff);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .btn:hover {
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            transform: scale(1.05);
        }

        #rail {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #333, #666, #333);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="rail"></div>
        <div id="spaceship"></div>
        
        <div id="gameUI">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
            <div id="orientationStatus">Tilt to move!</div>
        </div>

        <div id="startScreen">
            <h1>🚀 SPACESHIP DODGE</h1>
            <p>Tilt your device left and right to move your spaceship!<br>
            Avoid the falling projectiles to survive.<br><br>
            <small>On desktop: Use arrow keys or A/D keys</small></p>
            <button class="btn" onclick="startGame()">START GAME</button>
        </div>

        <div id="gameOverScreen" style="display: none;">
            <h1>GAME OVER</h1>
            <p>Your Score: <span id="finalScore">0</span></p>
            <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        let gameState = {
            isPlaying: false,
            score: 0,
            lives: 3,
            spaceshipX: 0,
            projectiles: [],
            gameSpeed: 2,
            spawnRate: 0.02,
            orientationSupported: false
        };

        const spaceship = document.getElementById('spaceship');
        const gameContainer = document.getElementById('gameContainer');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreElement = document.getElementById('finalScore');
        const orientationStatus = document.getElementById('orientationStatus');

        let containerWidth = window.innerWidth;
        let containerHeight = window.innerHeight;

        // Create starfield background
        function createStars() {
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 2 + 's';
                gameContainer.appendChild(star);
            }
        }

        // Initialize spaceship position
        function initializeSpaceship() {
            containerWidth = window.innerWidth;
            containerHeight = window.innerHeight;
            gameState.spaceshipX = containerWidth / 2; // Center spaceship
            updateSpaceshipPosition();
        }

        // Update spaceship position
        function updateSpaceshipPosition() {
            const minX = 40; // Half spaceship width
            const maxX = containerWidth - 40; // Half spaceship width
            gameState.spaceshipX = Math.max(minX, Math.min(maxX, gameState.spaceshipX));
            spaceship.style.left = gameState.spaceshipX + 'px';
        }

        // Device orientation controls
        function handleOrientation(event) {
            if (!gameState.isPlaying) return;
            
            // Get gamma (left-right tilt) and beta for fallback
            let tilt = event.gamma; // -90 to 90 degrees (left-right)
            
            // Fallback to beta if gamma not available
            if (tilt === null || tilt === undefined) {
                tilt = event.beta; // -180 to 180 degrees
            }
            
            if (tilt === null || tilt === undefined) return;
            
            // Normalize and apply sensitivity
            const sensitivity = 4;
            const movement = tilt * sensitivity;
            
            gameState.spaceshipX += movement;
            updateSpaceshipPosition();
            
            orientationStatus.textContent = `Tilt: ${Math.round(tilt)}° (${gameState.orientationSupported ? 'Active' : 'Testing'})`;
        }

        // Keyboard controls for desktop
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function handleKeyboardControls() {
            if (!gameState.isPlaying) return;
            
            const speed = 8;
            
            if (keys['arrowleft'] || keys['a']) {
                gameState.spaceshipX -= speed;
            }
            if (keys['arrowright'] || keys['d']) {
                gameState.spaceshipX += speed;
            }
            
            updateSpaceshipPosition();
        }

        // Projectile management
        function createProjectile() {
            const projectile = document.createElement('div');
            projectile.className = 'projectile';
            projectile.style.left = Math.random() * (containerWidth - 20) + 'px';
            projectile.style.top = '-20px';
            gameContainer.appendChild(projectile);
            
            gameState.projectiles.push({
                element: projectile,
                x: parseFloat(projectile.style.left),
                y: -20,
                speed: gameState.gameSpeed + Math.random() * 2
            });
        }

        function updateProjectiles() {
            for (let i = gameState.projectiles.length - 1; i >= 0; i--) {
                const projectile = gameState.projectiles[i];
                projectile.y += projectile.speed;
                projectile.element.style.top = projectile.y + 'px';

                // Remove projectiles that are off screen
                if (projectile.y > containerHeight) {
                    projectile.element.remove();
                    gameState.projectiles.splice(i, 1);
                    gameState.score += 10;
                    continue;
                }

                // Collision detection
                if (checkCollision(projectile)) {
                    projectile.element.remove();
                    gameState.projectiles.splice(i, 1);
                    gameState.lives--;
                    
                    // Flash effect
                    spaceship.style.filter = 'brightness(0.3)';
                    setTimeout(() => {
                        spaceship.style.filter = 'brightness(1)';
                    }, 200);
                    
                    if (gameState.lives <= 0) {
                        endGame();
                    }
                }
            }
        }

        function checkCollision(projectile) {
            const spaceshipRect = {
                x: gameState.spaceshipX,
                y: containerHeight - 60,
                width: 40,
                height: 40
            };

            const projectileRect = {
                x: projectile.x,
                y: projectile.y,
                width: 20,
                height: 20
            };

            return (spaceshipRect.x < projectileRect.x + projectileRect.width &&
                    spaceshipRect.x + spaceshipRect.width > projectileRect.x &&
                    spaceshipRect.y < projectileRect.y + projectileRect.height &&
                    spaceshipRect.y + spaceshipRect.height > projectileRect.y);
        }

        // Game loop
        function gameLoop() {
            if (!gameState.isPlaying) return;

            handleKeyboardControls();

            // Spawn projectiles
            if (Math.random() < gameState.spawnRate) {
                createProjectile();
            }

            updateProjectiles();
            updateUI();

            // Increase difficulty
            gameState.gameSpeed += 0.001;
            gameState.spawnRate += 0.0001;

            requestAnimationFrame(gameLoop);
        }

        function updateUI() {
            scoreElement.textContent = gameState.score;
            livesElement.textContent = gameState.lives;
        }

        // Game state management
        function startGame() {
            gameState.isPlaying = true;
            gameState.score = 0;
            gameState.lives = 3;
            gameState.gameSpeed = 2;
            gameState.spawnRate = 0.02;
            gameState.projectiles = [];

            // Clear existing projectiles
            document.querySelectorAll('.projectile').forEach(p => p.remove());

            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            initializeSpaceship();
            updateUI();
            gameLoop();

            // Enhanced orientation setup
            setupOrientation();
        }

        function setupOrientation() {
            // Remove any existing listeners
            window.removeEventListener('deviceorientation', handleOrientation);
            
            // Check if device orientation is supported
            if ('DeviceOrientationEvent' in window) {
                // Request permission on iOS 13+
                if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission()
                        .then(response => {
                            if (response === 'granted') {
                                window.addEventListener('deviceorientation', handleOrientation, true);
                                gameState.orientationSupported = true;
                                orientationStatus.textContent = 'Tilt to move! (Permission granted)';
                            } else {
                                orientationStatus.textContent = 'Orientation denied - Use arrow keys';
                            }
                        })
                        .catch(() => {
                            orientationStatus.textContent = 'Use arrow keys or A/D';
                        });
                } else {
                    // For other devices
                    window.addEventListener('deviceorientation', handleOrientation, true);
                    gameState.orientationSupported = true;
                    orientationStatus.textContent = 'Tilt to move!';
                }
            } else {
                orientationStatus.textContent = 'Use arrow keys or A/D';
            }

            // Also add touch support for mobile debugging
            let touchStartX = 0;
            gameContainer.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
            });

            gameContainer.addEventListener('touchmove', (e) => {
                if (!gameState.isPlaying) return;
                e.preventDefault();
                const touchX = e.touches[0].clientX;
                const deltaX = touchX - touchStartX;
                gameState.spaceshipX += deltaX * 0.5;
                updateSpaceshipPosition();
                touchStartX = touchX;
            });
        }

        function endGame() {
            gameState.isPlaying = false;
            finalScoreElement.textContent = gameState.score;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            startGame();
        }

        // Initialize
        window.addEventListener('resize', () => {
            containerWidth = window.innerWidth;
            containerHeight = window.innerHeight;
            if (gameState.isPlaying) {
                updateSpaceshipPosition();
            }
        });

        // Create stars on load
        createStars();
        initializeSpaceship();
    </script>
</body>
</html>
