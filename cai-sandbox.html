<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Spaceflight - Bubble Burst</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            cursor: none;
        }

        #gameCanvas {
            display: block;
            background: transparent;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #87ceeb;
            font-size: 18px;
            text-shadow: 0 0 10px rgba(135, 206, 235, 0.5);
            z-index: 100;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #87ceeb;
            text-align: center;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="stars" id="starField"></div>
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Bubbles Burst: <span id="bubblesBurst">0</span></div>
    </div>
    
    <div class="instructions">
        Move: WASD or Arrow Keys | Shoot: Spacebar or Click | Relax and enjoy the zen
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Game state
        let score = 0;
        let bubblesBurst = 0;
        let gameRunning = true;
        
        // Player spaceship
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 40,
            height: 60,
            speed: 5,
            color: '#87ceeb'
        };
        
        // Arrays for game objects
        const bullets = [];
        const bubbles = [];
        const particles = [];
        
        // Input handling
        const keys = {};
        let mouseX = 0;
        let mouseY = 0;
        let gyroX = 0;
        let gyroY = 0;
        let isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let gyroSupported = false;
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.code === 'Space') {
                e.preventDefault();
                shootBullet();
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });
        
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        document.addEventListener('click', () => {
            shootBullet();
        });
        
        // Touch controls for mobile
        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            shootBullet();
        });
        
        // Request device orientation permission for iOS
        function requestGyroPermission() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response == 'granted') {
                            enableGyroControls();
                        }
                    })
                    .catch(console.error);
            } else {
                enableGyroControls();
            }
        }
        
        // Enable gyroscope controls
        function enableGyroControls() {
            gyroSupported = true;
            window.addEventListener('deviceorientation', (e) => {
                // Convert device orientation to movement
                // beta: front-to-back tilt (-180 to 180)
                // gamma: left-to-right tilt (-90 to 90)
                
                if (e.gamma !== null && e.beta !== null) {
                    // Normalize gamma (-90 to 90) to movement range
                    gyroX = Math.max(-1, Math.min(1, e.gamma / 45)); // Divide by 45 for sensitivity
                    
                    // Normalize beta for forward/backward movement
                    // Adjust for typical holding angle (around 45-60 degrees)
                    let adjustedBeta = e.beta - 60; // Assume neutral position at 60 degrees
                    gyroY = Math.max(-1, Math.min(1, adjustedBeta / 30)); // Divide by 30 for sensitivity
                }
            });
        }
        
        // Initialize gyro on mobile
        if (isMobile) {
            // Auto-enable for Android, request permission for iOS
            setTimeout(() => {
                requestGyroPermission();
            }, 1000);
        }
        
        // Create starfield
        function createStars() {
            const starField = document.getElementById('starField');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = Math.random() * 3 + 1 + 'px';
                star.style.height = star.style.width;
                star.style.animationDelay = Math.random() * 3 + 's';
                starField.appendChild(star);
            }
        }
        
        // Bullet class
        function shootBullet() {
            bullets.push({
                x: player.x + player.width / 2,
                y: player.y,
                width: 4,
                height: 12,
                speed: 8,
                color: '#00ff88'
            });
        }
        
        // Bubble class
        function createBubble() {
            const size = Math.random() * 40 + 20;
            bubbles.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                size: size,
                speed: Math.random() * 2 + 1,
                color: `hsl(${Math.random() * 360}, 70%, 60%)`,
                shimmer: 0,
                alpha: 0.8
            });
        }
        
        // Particle effect for bubble burst
        function createParticles(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 1,
                    decay: Math.random() * 0.02 + 0.01
                });
            }
        }
        
        // Update game state
        function update() {
            if (!gameRunning) return;
            
            // Update player position
            if (keys['a'] || keys['arrowleft']) {
                player.x = Math.max(0, player.x - player.speed);
            }
            if (keys['d'] || keys['arrowright']) {
                player.x = Math.min(canvas.width - player.width, player.x + player.speed);
            }
            if (keys['w'] || keys['arrowup']) {
                player.y = Math.max(0, player.y - player.speed);
            }
            if (keys['s'] || keys['arrowdown']) {
                player.y = Math.min(canvas.height - player.height, player.y + player.speed);
            }
            
            // Update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.y -= bullet.speed;
                
                if (bullet.y < 0) {
                    bullets.splice(i, 1);
                }
            }
            
            // Update bubbles
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const bubble = bubbles[i];
                bubble.y += bubble.speed;
                bubble.shimmer += 0.1;
                
                if (bubble.y > canvas.height) {
                    bubbles.splice(i, 1);
                }
            }
            
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vx *= 0.98;
                particle.vy *= 0.98;
                particle.life -= particle.decay;
                
                if (particle.life <= 0) {
                    particles.splice(i, 1);
                }
            }
            
            // Check bullet-bubble collisions
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                for (let j = bubbles.length - 1; j >= 0; j--) {
                    const bubble = bubbles[j];
                    const dx = bullet.x - (bubble.x + bubble.size / 2);
                    const dy = bullet.y - (bubble.y + bubble.size / 2);
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < bubble.size / 2) {
                        // Create particle effect
                        createParticles(bubble.x + bubble.size / 2, bubble.y + bubble.size / 2, bubble.color);
                        
                        // Remove bullet and bubble
                        bullets.splice(i, 1);
                        bubbles.splice(j, 1);
                        
                        // Update score
                        score += Math.floor(bubble.size);
                        bubblesBurst++;
                        document.getElementById('score').textContent = score;
                        document.getElementById('bubblesBurst').textContent = bubblesBurst;
                        break;
                    }
                }
            }
            
            // Spawn new bubbles
            if (Math.random() < 0.02) {
                createBubble();
            }
        }
        
        // Render game
        function render() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw spaceship
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            
            // Ship body
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(0, -player.height / 2);
            ctx.lineTo(-player.width / 3, player.height / 2);
            ctx.lineTo(0, player.height / 3);
            ctx.lineTo(player.width / 3, player.height / 2);
            ctx.closePath();
            ctx.fill();
            
            // Ship glow
            ctx.shadowColor = player.color;
            ctx.shadowBlur = 15;
            ctx.fill();
            
            ctx.restore();
            
            // Draw bullets
            bullets.forEach(bullet => {
                ctx.fillStyle = bullet.color;
                ctx.shadowColor = bullet.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });
            
            // Draw bubbles
            bubbles.forEach(bubble => {
                ctx.save();
                ctx.globalAlpha = bubble.alpha;
                
                // Bubble main body
                const gradient = ctx.createRadialGradient(
                    bubble.x + bubble.size * 0.3, bubble.y + bubble.size * 0.3, 0,
                    bubble.x + bubble.size / 2, bubble.y + bubble.size / 2, bubble.size / 2
                );
                gradient.addColorStop(0, bubble.color);
                gradient.addColorStop(0.7, bubble.color.replace('60%', '60%, 0.5'));
                gradient.addColorStop(1, bubble.color.replace('60%', '60%, 0.2'));
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(bubble.x + bubble.size / 2, bubble.y + bubble.size / 2, bubble.size / 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Bubble highlight
                ctx.fillStyle = 'rgba(255, 255, 255, ' + (0.6 + Math.sin(bubble.shimmer) * 0.2) + ')';
                ctx.beginPath();
                ctx.arc(bubble.x + bubble.size * 0.3, bubble.y + bubble.size * 0.3, bubble.size * 0.15, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            });
            
            // Draw particles
            particles.forEach(particle => {
                ctx.save();
                ctx.globalAlpha = particle.life;
                ctx.fillStyle = particle.color;
                ctx.shadowColor = particle.color;
                ctx.shadowBlur = 5;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
            
            // Reset shadow
            ctx.shadowBlur = 0;
        }
        
        // Game loop
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }
        
        // Initialize game
        function init() {
            createStars();
            
            // Create initial bubbles
            for (let i = 0; i < 5; i++) {
                setTimeout(() => createBubble(), i * 1000);
            }
            
            gameLoop();
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = Math.min(player.x, canvas.width - player.width);
            player.y = Math.min(player.y, canvas.height - player.height);
        });
        
        // Start the game
        init();
    </script>
</body>
</html>
