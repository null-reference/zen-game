<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zen Rain Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .raindrop {
      position: absolute;
      width: 4px;
      height: 10px;
      background: lightblue;
      border-radius: 50%;
      opacity: 0.7;
      animation: fall linear;
    }

    @keyframes fall {
      from { top: -10px; }
      to { top: 100vh; }
    }

    #cup {
      position: absolute;
      bottom: 10px;
      width: 80px;
      height: 50px;
      background: #444;
      border-radius: 0 0 40px 40px;
      border: 3px solid white;
      left: 50%;
      transform: translateX(-50%);
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="cup"></div>
  </div>
  <script>
    const game = document.getElementById('game');
    const cup = document.getElementById('cup');
    let cupX = window.innerWidth / 2;
    let fillLevel = 0;
    const maxFill = 20;

    function createRaindrop() {
      const drop = document.createElement('div');
      drop.className = 'raindrop';
      drop.style.left = `${Math.random() * window.innerWidth}px`;
      drop.style.animationDuration = `${2 + Math.random()}s`;
      game.appendChild(drop);

      const fall = setInterval(() => {
        const dropRect = drop.getBoundingClientRect();
        const cupRect = cup.getBoundingClientRect();

        if (
          dropRect.bottom >= cupRect.top &&
          dropRect.left >= cupRect.left &&
          dropRect.right <= cupRect.right
        ) {
          game.removeChild(drop);
          clearInterval(fall);
          fillLevel++;
          checkCupFill();
        } else if (dropRect.top > window.innerHeight) {
          game.removeChild(drop);
          clearInterval(fall);
        }
      }, 50);
    }

    function checkCupFill() {
      if (fillLevel >= maxFill) {
        flashCup();
        fillLevel = 0;
      }
    }

    function flashCup() {
      const colors = ['#ff69b4', '#00ffff', '#7fff00', '#ffa500'];
      let i = 0;
      const flashInterval = setInterval(() => {
        cup.style.borderColor = colors[i % colors.length];
        i++;
        if (i > 10) {
          clearInterval(flashInterval);
          cup.style.borderColor = 'white';
        }
      }, 100);
    }

    document.addEventListener('keydown', (e) => {
      const step = 20;
      if (e.key === 'ArrowLeft') cupX -= step;
      if (e.key === 'ArrowRight') cupX += step;
      cupX = Math.max(0, Math.min(window.innerWidth - cup.offsetWidth, cupX));
      cup.style.left = `${cupX}px`;
    });

    setInterval(createRaindrop, 300);
  </script>
</body>
</html>
