<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Orb - Floating Meditation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            font-size: 18px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            color: rgba(255,255,255,0.8);
            text-align: center;
            font-size: 14px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #gameOver, #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            display: none;
        }

        #startScreen {
            display: block;
        }

        #restartBtn, #startBtn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }

        #restartBtn:hover, #startBtn:hover {
            transform: scale(1.05);
        }

        #gyroStatus {
            position: absolute;
            top: 60px;
            left: 20px;
            z-index: 100;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div>Time: <span id="time">0</span>s</div>
        </div>
        
        <div id="gyroStatus">Gyroscope: <span id="gyroState">Inactive</span></div>
        
        <div id="instructions">
            Tilt your device to move your orb • Avoid the floating obstacles
        </div>

        <div id="startScreen">
            <h2>Zen Orb</h2>
            <p>Hold your device comfortably</p>
            <p>This position will be your center</p>
            <button id="startBtn">Begin Meditation</button>
        </div>

        <div id="gameOver">
            <h2>Meditation Complete</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Time Survived: <span id="finalTime">0</span>s</p>
            <button id="restartBtn">Begin Again</button>
        </div>
    </div>

    <script>
        class ZenOrbGame {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.playerOrb = null;
                this.obstacles = [];
                this.particles = [];
                
                this.score = 0;
                this.gameTime = 0;
                this.gameRunning = false;
                this.gameStarted = false;
                this.lastTime = 0;
                
                // Control variables
                this.mouseX = 0;
                this.mouseY = 0;
                this.targetX = 0;
                this.targetY = 0;
                
                // Gyroscope variables
                this.gyroEnabled = false;
                this.baseGamma = null; // Left-right tilt baseline
                this.baseBeta = null;  // Front-back tilt baseline
                this.gyroSensitivity = 0.5;
                this.gyroHandler = null;
                
                this.init();
                this.createPlayer();
                this.createParticles();
                this.setupControls();
                this.animate();
            }

            init() {
                // Scene
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.Fog(0x667eea, 20, 100);
                
                // Camera
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.z = 30;
                
                // Renderer
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x667eea, 0.1);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.getElementById('gameContainer').appendChild(this.renderer.domElement);
                
                // Lighting
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 10, 5);
                directionalLight.castShadow = true;
                this.scene.add(directionalLight);
                
                // Resize handler
                window.addEventListener('resize', () => this.onWindowResize());
            }

            createPlayer() {
                const geometry = new THREE.SphereGeometry(0.8, 32, 32);
                const material = new THREE.MeshPhongMaterial({
                    color: 0x00ff88,
                    emissive: 0x002211,
                    shininess: 100,
                    transparent: true,
                    opacity: 0.9
                });
                
                this.playerOrb = new THREE.Mesh(geometry, material);
                this.playerOrb.position.set(0, -8, 0);
                this.playerOrb.castShadow = true;
                this.scene.add(this.playerOrb);
                
                // Add glow effect
                const glowGeometry = new THREE.SphereGeometry(1.2, 16, 16);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ff88,
                    transparent: true,
                    opacity: 0.3
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                this.playerOrb.add(glow);
            }

            createParticles() {
                const particleCount = 200;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);
                
                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * 100;
                    positions[i * 3 + 1] = (Math.random() - 0.5) * 100;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
                    
                    colors[i * 3] = Math.random() * 0.5 + 0.5;
                    colors[i * 3 + 1] = Math.random() * 0.5 + 0.5;
                    colors[i * 3 + 2] = 1;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                
                const material = new THREE.PointsMaterial({
                    size: 0.5,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.6
                });
                
                const particles = new THREE.Points(geometry, material);
                this.scene.add(particles);
                this.backgroundParticles = particles;
            }

            setupControls() {
                // Start button
                document.getElementById('startBtn').addEventListener('click', () => {
                    this.requestMotionAccess();
                });
                
                // Touch controls (fallback)
                this.renderer.domElement.addEventListener('touchstart', (e) => {
                    if (!this.gameStarted) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.updateMousePosition(touch.clientX, touch.clientY);
                });
                
                this.renderer.domElement.addEventListener('touchmove', (e) => {
                    if (!this.gameStarted) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.updateMousePosition(touch.clientX, touch.clientY);
                });
                
                // Mouse controls for desktop (fallback)
                this.renderer.domElement.addEventListener('mousemove', (e) => {
                    if (!this.gameStarted) return;
                    this.updateMousePosition(e.clientX, e.clientY);
                });
                
                // Restart button
                document.getElementById('restartBtn').addEventListener('click', () => {
                    this.restart();
                });
            }

            async requestMotionAccess() {
                console.log('🚀 Start button pressed!');
                document.getElementById('gyroState').textContent = 'Requesting permissions...';
                
                try {
                    let permissionGranted = false;
                    
                    // Check if we're on iOS and need permission
                    if (typeof DeviceOrientationEvent !== 'undefined' && 
                        typeof DeviceOrientationEvent.requestPermission === 'function') {
                        console.log('📱 iOS device detected, requesting permission...');
                        try {
                            const permission = await DeviceOrientationEvent.requestPermission();
                            console.log('🔐 iOS Permission result:', permission);
                            permissionGranted = (permission === 'granted');
                        } catch (err) {
                            console.log('❌ iOS permission error:', err);
                            permissionGranted = false;
                        }
                    } else {
                        console.log('🤖 Non-iOS device or no permission needed');
                        permissionGranted = true;
                    }
                    
                    if (permissionGranted) {
                        console.log('✅ Permissions OK, testing gyroscope...');
                        this.testGyroscopeAvailability();
                    } else {
                        console.log('❌ Permission denied');
                        this.startWithoutGyro();
                    }
                } catch (error) {
                    console.log('💥 Motion access error:', error);
                    this.startWithoutGyro();
                }
            }

            testGyroscopeAvailability() {
                console.log('🧪 Testing gyroscope availability...');
                document.getElementById('gyroState').textContent = 'Testing gyroscope...';
                
                let testCount = 0;
                let gyroFound = false;
                
                // Test regular deviceorientation
                const regularTest = (event) => {
                    testCount++;
                    console.log(`📊 Regular gyro test ${testCount}:`, {
                        gamma: event.gamma,
                        beta: event.beta,
                        alpha: event.alpha,
                        absolute: event.absolute
                    });
                    
                    if (event.gamma !== null && event.beta !== null && !gyroFound) {
                        gyroFound = true;
                        console.log('✅ Regular gyroscope working!');
                        window.removeEventListener('deviceorientation', regularTest);
                        window.removeEventListener('deviceorientationabsolute', absoluteTest);
                        this.initializeGyroscope();
                    }
                };
                
                // Test absolute deviceorientation
                const absoluteTest = (event) => {
                    console.log('📊 Absolute gyro test:', {
                        gamma: event.gamma,
                        beta: event.beta,
                        alpha: event.alpha
                    });
                    
                    if (event.gamma !== null && event.beta !== null && !gyroFound) {
                        gyroFound = true;
                        console.log('✅ Absolute gyroscope working!');
                        window.removeEventListener('deviceorientation', regularTest);
                        window.removeEventListener('deviceorientationabsolute', absoluteTest);
                        this.initializeGyroscope();
                    }
                };
                
                window.addEventListener('deviceorientation', regularTest);
                window.addEventListener('deviceorientationabsolute', absoluteTest);
                
                // Also try motion events as backup
                const motionTest = (event) => {
                    console.log('📊 Motion test:', {
                        acceleration: event.acceleration,
                        rotationRate: event.rotationRate
                    });
                };
                window.addEventListener('devicemotion', motionTest);
                
                // Timeout after 6 seconds
                setTimeout(() => {
                    if (!gyroFound) {
                        console.log('⏰ No gyroscope detected after 6 seconds');
                        console.log('🔍 Device info:', {
                            userAgent: navigator.userAgent,
                            platform: navigator.platform,
                            vendor: navigator.vendor
                        });
                        window.removeEventListener('deviceorientation', regularTest);
                        window.removeEventListener('deviceorientationabsolute', absoluteTest);
                        window.removeEventListener('devicemotion', motionTest);
                        this.startWithoutGyro();
                    }
                }, 6000);
            }

            initializeGyroscope() {
                console.log('🎯 Initializing gyroscope for game...');
                this.gyroEnabled = true;
                document.getElementById('gyroState').textContent = 'Gyroscope ready!';
                this.setupGameGyroscope();
                
                setTimeout(() => {
                    this.startGame();
                }, 1000);
            }

            setupGameGyroscope() {
                console.log('🎮 Setting up game gyroscope handler...');
                
                // Remove any existing handler
                if (this.gyroHandler) {
                    window.removeEventListener('deviceorientation', this.gyroHandler);
                }
                
                this.gyroHandler = (event) => {
                    // Always log the first few events to debug
                    if (!this.baseGamma && !this.baseBeta) {
                        console.log('🎯 Game gyro event (before baseline):', {
                            gamma: event.gamma,
                            beta: event.beta,
                            gameStarted: this.gameStarted,
                            gameRunning: this.gameRunning
                        });
                    }
                    
                    if (!this.gameStarted) {
                        console.log('⏸️ Game not started yet, ignoring gyro event');
                        return;
                    }
                    
                    // Set baseline on first reading after game starts
                    if (this.baseGamma === null || this.baseBeta === null) {
                        this.baseGamma = event.gamma || 0;
                        this.baseBeta = event.beta || 0;
                        console.log('🎯 Game baseline set:', {
                            baseGamma: this.baseGamma,
                            baseBeta: this.baseBeta
                        });
                        document.getElementById('gyroState').textContent = `Gyroscope Active (γ:${this.baseGamma.toFixed(1)}° β:${this.baseBeta.toFixed(1)}°)`;
                        return;
                    }
                    
                    if (this.gameRunning) {
                        this.handleGyroscope(event);
                    }
                };
                
                window.addEventListener('deviceorientation', this.gyroHandler);
                console.log('✅ Game gyroscope handler added');
            }

            handleGyroscope(event) {
                if (!this.gyroEnabled || event.gamma === null || event.beta === null) {
                    console.log('⚠️ Gyro handler called but conditions not met:', {
                        gyroEnabled: this.gyroEnabled,
                        gamma: event.gamma,
                        beta: event.beta
                    });
                    return;
                }
                if (this.baseGamma === null || this.baseBeta === null) {
                    console.log('⚠️ Baseline not set yet');
                    return;
                }
                
                // Calculate tilt relative to baseline
                const deltaGamma = (event.gamma - this.baseGamma) * this.gyroSensitivity;
                const deltaBeta = (event.beta - this.baseBeta) * this.gyroSensitivity;
                
                // Convert to game coordinates with limits
                const newTargetX = Math.max(-15, Math.min(15, deltaGamma));
                const newTargetY = Math.max(-10, Math.min(10, -deltaBeta)); // Inverted for natural feel
                
                // Only update if there's a meaningful change
                if (Math.abs(newTargetX - this.targetX) > 0.1 || Math.abs(newTargetY - this.targetY) > 0.1) {
                    this.targetX = newTargetX;
                    this.targetY = newTargetY;
                    
                    // Log every movement for debugging
                    console.log(`🎮 Gyro movement: γ${event.gamma.toFixed(1)}° β${event.beta.toFixed(1)}° → target(${this.targetX.toFixed(1)}, ${this.targetY.toFixed(1)}) | player(${this.playerOrb.position.x.toFixed(1)}, ${this.playerOrb.position.y.toFixed(1)})`);
                }
            }

            startWithoutGyro() {
                console.log('Starting without gyroscope');
                document.getElementById('gyroState').textContent = 'Touch Controls Active';
                document.getElementById('instructions').textContent = 'Touch and drag to move your orb • Avoid the floating obstacles';
                this.startGame();
            }

            startGame() {
                console.log('Starti
