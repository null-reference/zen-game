<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Orb - Floating Meditation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            font-size: 18px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            color: rgba(255,255,255,0.8);
            text-align: center;
            font-size: 14px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #gameOver, #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            display: none;
        }

        #startScreen {
            display: block;
        }

        #restartBtn, #startBtn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s;
        }

        #restartBtn:hover, #startBtn:hover {
            transform: scale(1.05);
        }

        #gyroStatus {
            position: absolute;
            top: 60px;
            left: 20px;
            z-index: 100;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div>Time: <span id="time">0</span>s</div>
        </div>
        
        <div id="gyroStatus">Gyroscope: <span id="gyroState">Inactive</span></div>
        
        <div id="instructions">
            Tilt your device to move your orb • Avoid the floating obstacles
        </div>

        <div id="startScreen">
            <h2>Zen Orb</h2>
            <p>Hold your device comfortably</p>
            <p>This position will be your center</p>
            <button id="startBtn">Begin Meditation</button>
        </div>

        <div id="gameOver">
            <h2>Meditation Complete</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <p>Time Survived: <span id="finalTime">0</span>s</p>
            <button id="restartBtn">Begin Again</button>
        </div>
    </div>

    <script>
        class ZenOrbGame {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.playerOrb = null;
                this.obstacles = [];
                this.particles = [];
                
                this.score = 0;
                this.gameTime = 0;
                this.gameRunning = false;
                this.gameStarted = false;
                this.lastTime = 0;
                
                // Control variables
                this.mouseX = 0;
                this.mouseY = 0;
                this.targetX = 0;
                this.targetY = 0;
                
                // Gyroscope variables
                this.gyroEnabled = false;
                this.baseGamma = null; // Left-right tilt baseline
                this.baseBeta = null;  // Front-back tilt baseline
                this.gyroSensitivity = 0.5;
                this.gyroHandler = null;
                
                this.init();
                this.createPlayer();
                this.createParticles();
                this.setupControls();
                this.animate();
            }

            init() {
                // Scene
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.Fog(0x667eea, 20, 100);
                
                // Camera
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.z = 30;
                
                // Renderer
                this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setClearColor(0x667eea, 0.1);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.getElementById('gameContainer').appendChild(this.renderer.domElement);
                
                // Lighting
                const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
                this.scene.add(ambientLight);
                
                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(10, 10, 5);
                directionalLight.castShadow = true;
                this.scene.add(directionalLight);
                
                // Resize handler
                window.addEventListener('resize', () => this.onWindowResize());
            }

            createPlayer() {
                const geometry = new THREE.SphereGeometry(0.8, 32, 32);
                const material = new THREE.MeshPhongMaterial({
                    color: 0x00ff88,
                    emissive: 0x002211,
                    shininess: 100,
                    transparent: true,
                    opacity: 0.9
                });
                
                this.playerOrb = new THREE.Mesh(geometry, material);
                this.playerOrb.position.set(0, -8, 0);
                this.playerOrb.castShadow = true;
                this.scene.add(this.playerOrb);
                
                // Add glow effect
                const glowGeometry = new THREE.SphereGeometry(1.2, 16, 16);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ff88,
                    transparent: true,
                    opacity: 0.3
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                this.playerOrb.add(glow);
            }

            createParticles() {
                const particleCount = 200;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const colors = new Float32Array(particleCount * 3);
                
                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * 100;
                    positions[i * 3 + 1] = (Math.random() - 0.5) * 100;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 100;
                    
                    colors[i * 3] = Math.random() * 0.5 + 0.5;
                    colors[i * 3 + 1] = Math.random() * 0.5 + 0.5;
                    colors[i * 3 + 2] = 1;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                
                const material = new THREE.PointsMaterial({
                    size: 0.5,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.6
                });
                
                const particles = new THREE.Points(geometry, material);
                this.scene.add(particles);
                this.backgroundParticles = particles;
            }

            setupControls() {
                // Start button
                document.getElementById('startBtn').addEventListener('click', () => {
                    this.requestMotionAccess();
                });
                
                // Touch controls (fallback)
                this.renderer.domElement.addEventListener('touchstart', (e) => {
                    if (!this.gameStarted) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.updateMousePosition(touch.clientX, touch.clientY);
                });
                
                this.renderer.domElement.addEventListener('touchmove', (e) => {
                    if (!this.gameStarted) return;
                    e.preventDefault();
                    const touch = e.touches[0];
                    this.updateMousePosition(touch.clientX, touch.clientY);
                });
                
                // Mouse controls for desktop (fallback)
                this.renderer.domElement.addEventListener('mousemove', (e) => {
                    if (!this.gameStarted) return;
                    this.updateMousePosition(e.clientX, e.clientY);
                });
                
                // Restart button
                document.getElementById('restartBtn').addEventListener('click', () => {
                    this.restart();
                });
            }

            async requestMotionAccess() {
                console.log('Start button pressed!');
                document.getElementById('gyroState').textContent = 'Requesting...';
                
                try {
                    // Check if we need to request permission (iOS 13+)
                    if (typeof DeviceOrientationEvent !== 'undefined' && 
                        typeof DeviceOrientationEvent.requestPermission === 'function') {
                        console.log('Requesting iOS permission...');
                        const permission = await DeviceOrientationEvent.requestPermission();
                        console.log('Permission result:', permission);
                        if (permission === 'granted') {
                            this.setupGyroscope();
                        } else {
                            this.startWithoutGyro();
                        }
                    } else {
                        // Android or older iOS or desktop
                        console.log('No permission needed, setting up gyroscope...');
                        this.setupGyroscope();
                    }
                } catch (error) {
                    console.log('Motion access error:', error);
                    this.startWithoutGyro();
                }
            }

            setupGyroscope() {
                console.log('Setting up gyroscope...');
                document.getElementById('gyroState').textContent = 'Detecting...';
                
                // Test if gyroscope is working first
                let testCount = 0;
                let gyroDetected = false;
                
                const testHandler = (event) => {
                    testCount++;
                    console.log(`Gyro test ${testCount}:`, event.gamma, event.beta, event.alpha);
                    
                    if (!gyroDetected && event.gamma !== null && event.beta !== null) {
                        gyroDetected = true;
                        this.gyroEnabled = true;
                        document.getElementById('gyroState').textContent = 'Ready - Hold steady and tilt to play';
                        console.log('Gyroscope detected!');
                        
                        // Set up the actual game handler
                        window.removeEventListener('deviceorientation', testHandler);
                        this.setupGameGyroscope();
                        
                        // Start the game after a short delay
                        setTimeout(() => {
                            this.startGame();
                        }, 1500);
                        
                    } else if (testCount > 20) {
                        console.log('Gyroscope not detected after 20 attempts');
                        window.removeEventListener('deviceorientation', testHandler);
                        this.startWithoutGyro();
                    }
                };
                
                window.addEventListener('deviceorientation', testHandler);
                
                // Fallback timeout
                setTimeout(() => {
                    if (!gyroDetected) {
                        console.log('Gyroscope timeout, falling back to touch');
                        window.removeEventListener('deviceorientation', testHandler);
                        this.startWithoutGyro();
                    }
                }, 3000);
            }

            setupGameGyroscope() {
                console.log('Setting up game gyroscope handler...');
                
                // Remove any existing handler
                if (this.gyroHandler) {
                    window.removeEventListener('deviceorientation', this.gyroHandler);
                }
                
                this.gyroHandler = (event) => {
                    if (!this.gameStarted) return;
                    
                    // Set baseline on first reading after game starts
                    if (this.baseGamma === null || this.baseBeta === null) {
                        this.baseGamma = event.gamma || 0;
                        this.baseBeta = event.beta || 0;
                        console.log('Game baseline set:', this.baseGamma, this.baseBeta);
                        document.getElementById('gyroState').textContent = 'Gyroscope Active';
                        return;
                    }
                    
                    if (this.gameRunning) {
                        this.handleGyroscope(event);
                    }
                };
                
                window.addEventListener('deviceorientation', this.gyroHandler);
            }

            handleGyroscope(event) {
                if (!this.gyroEnabled || event.gamma === null || event.beta === null) return;
                if (this.baseGamma === null || this.baseBeta === null) return;
                
                // Calculate tilt relative to baseline
                const deltaGamma = (event.gamma - this.baseGamma) * this.gyroSensitivity;
                const deltaBeta = (event.beta - this.baseBeta) * this.gyroSensitivity;
                
                // Convert to game coordinates with limits
                this.targetX = Math.max(-15, Math.min(15, deltaGamma));
                this.targetY = Math.max(-10, Math.min(10, -deltaBeta)); // Inverted for natural feel
                
                // Debug logging every 30 frames (roughly once per second)
                if (Math.random() < 0.033) {
                    console.log(`Gyro active: γ${event.gamma.toFixed(1)}° (Δ${deltaGamma.toFixed(1)}) β${event.beta.toFixed(1)}° (Δ${deltaBeta.toFixed(1)}) → (${this.targetX.toFixed(1)}, ${this.targetY.toFixed(1)})`);
                }
            }

            startWithoutGyro() {
                console.log('Starting without gyroscope');
                document.getElementById('gyroState').textContent = 'Touch Controls Active';
                document.getElementById('instructions').textContent = 'Touch and drag to move your orb • Avoid the floating obstacles';
                this.startGame();
            }

            startGame() {
                console.log('Starting game...');
                this.gameStarted = true;
                this.gameRunning = true;
                
                // Reset baseline for gyroscope calibration
                this.baseGamma = null;
                this.baseBeta = null;
                
                document.getElementById('startScreen').style.display = 'none';
                
                // Start spawning obstacles after a brief delay
                setTimeout(() => {
                    this.spawnObstacles();
                }, 1000);
            }

            updateMousePosition(clientX, clientY) {
                // Only use touch controls if gyroscope is not enabled
                if (this.gyroEnabled) return;
                
                this.mouseX = (clientX / window.innerWidth) * 2 - 1;
                this.mouseY = -(clientY / window.innerHeight) * 2 + 1;
                
                this.targetX = this.mouseX * 15;
                this.targetY = this.mouseY * 10;
            }

            spawnObstacles() {
                if (!this.gameRunning) return;
                
                const geometry = new THREE.SphereGeometry(Math.random() * 1.5 + 0.5, 16, 16);
                const hue = Math.random();
                const color = new THREE.Color().setHSL(hue, 0.7, 0.6);
                
                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    emissive: color.clone().multiplyScalar(0.2),
                    transparent: true,
                    opacity: 0.8
                });
                
                const obstacle = new THREE.Mesh(geometry, material);
                
                // Random spawn position
                const side = Math.floor(Math.random() * 4);
                switch(side) {
                    case 0: // Top
                        obstacle.position.set((Math.random() - 0.5) * 30, 15, 0);
                        obstacle.velocity = new THREE.Vector3(0, -2 - Math.random() * 2, 0);
                        break;
                    case 1: // Bottom
                        obstacle.position.set((Math.random() - 0.5) * 30, -15, 0);
                        obstacle.velocity = new THREE.Vector3(0, 2 + Math.random() * 2, 0);
                        break;
                    case 2: // Left
                        obstacle.position.set(-20, (Math.random() - 0.5) * 20, 0);
                        obstacle.velocity = new THREE.Vector3(2 + Math.random() * 2, 0, 0);
                        break;
                    case 3: // Right
                        obstacle.position.set(20, (Math.random() - 0.5) * 20, 0);
                        obstacle.velocity = new THREE.Vector3(-2 - Math.random() * 2, 0, 0);
                        break;
                }
                
                obstacle.rotationSpeed = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.1,
                    (Math.random() - 0.5) * 0.1,
                    (Math.random() - 0.5) * 0.1
                );
                
                this.obstacles.push(obstacle);
                this.scene.add(obstacle);
                
                // Schedule next spawn
                setTimeout(() => this.spawnObstacles(), 1000 + Math.random() * 2000);
            }

            checkCollisions() {
                const playerPos = this.playerOrb.position;
                
                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    const obstacle = this.obstacles[i];
                    const distance = playerPos.distanceTo(obstacle.position);
                    
                    if (distance < 1.5) {
                        this.gameOver();
