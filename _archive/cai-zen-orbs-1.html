<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zen Orbs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            touch-action: none;
        }
        
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            z-index: 100;
        }
        
        #startButton {
            padding: 20px 40px;
            font-size: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin-top: 20px;
        }
        
        #startButton:active {
            transform: scale(0.95);
        }
        
        #score {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 50;
        }
        
        #debug {
            position: absolute;
            top: 60px;
            left: 20px;
            color: white;
            font-size: 12px;
            font-family: monospace;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 50;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            z-index: 100;
        }
        
        .info {
            text-align: center;
            max-width: 80%;
            margin-bottom: 30px;
            line-height: 1.6;
            opacity: 0.8;
        }
        
        h1 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        #touchPad {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            display: none;
            z-index: 60;
        }
        
        #touchPadStick {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>Zen Orbs</h1>
        <div class="info">
            <p>Hold your device flat and tilt to control your orb</p>
            <p>Avoid the floating orbs as long as you can</p>
            <p>Find your flow in the cosmic dance</p>
        </div>
        <button id="startButton">Start Journey</button>
    </div>
    
    <div id="gameOverScreen">
        <h1>Journey Complete</h1>
        <div class="info">
            <p id="finalScore">Score: 0</p>
            <p>Your consciousness has expanded</p>
        </div>
        <button id="restartButton">Begin Again</button>
    </div>
    
    <div id="score">Score: 0</div>
    <div id="debug"></div>
    
    <div id="touchPad">
        <div id="touchPadStick"></div>
    </div>
    
    <canvas id="canvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module">
        import RAPIER from 'https://cdn.skypack.dev/@dimforge/rapier3d-compat@0.11.2';
        
        let scene, camera, renderer;
        let world;
        let playerBody, playerMesh;
        let obstacles = [];
        let score = 0;
        let gameRunning = false;
        let baseAlpha = 0, baseBeta = 0, baseGamma = 0;
        let currentAlpha = 0, currentBeta = 0, currentGamma = 0;
        let particles;
        let useGyro = false;
        let touchInput = { x: 0, z: 0 };
        let debugMode = true;
        
        const PLAYER_RADIUS = 0.5;
        const OBSTACLE_RADIUS = 0.4;
        const WORLD_SIZE = 20;
        const OBSTACLE_COUNT = 15;
        
        async function init() {
            console.log("Initializing game...");
            
            try {
                await RAPIER.init();
                console.log("Rapier physics initialized");
            } catch (error) {
                console.error("Failed to initialize Rapier:", error);
                alert("Failed to load physics engine. Please refresh the page.");
                return;
            }
            
            // Three.js setup
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000000, 5, 30);
            
            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                100
            );
            camera.position.set(0, 10, 15);
            camera.lookAt(0, 0, 0);
            
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('canvas'),
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);
            
            const light1 = new THREE.PointLight(0x667eea, 1, 50);
            light1.position.set(10, 10, 10);
            scene.add(light1);
            
            const light2 = new THREE.PointLight(0x764ba2, 1, 50);
            light2.position.set(-10, 10, -10);
            scene.add(light2);
            
            // Particles for atmosphere
            const particleGeometry = new THREE.BufferGeometry();
            const particleCount = 1000;
            const positions = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 50;
                positions[i + 1] = (Math.random() - 0.5) * 50;
                positions[i + 2] = (Math.random() - 0.5) * 50;
            }
            
            particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const particleMaterial = new THREE.PointsMaterial({
                size: 0.1,
                color: 0xffffff,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            
            particles = new THREE.Points(particleGeometry, particleMaterial);
            scene.add(particles);
            
            // Physics world
            world = new RAPIER.World({ x: 0.0, y: 0.0, z: 0.0 });
            
            // Setup event listeners
            document.getElementById('startButton').addEventListener('click', startButtonClicked);
            document.getElementById('restartButton').addEventListener('click', () => {
                document.getElementById('gameOverScreen').style.display = 'none';
                document.getElementById('startScreen').style.display = 'flex';
            });
            
            window.addEventListener('resize', onWindowResize);
            
            // Setup touch controls
            setupTouchControls();
            
            console.log("Game initialized successfully");
        }
        
        function startButtonClicked() {
            console.log("Start button clicked");
            requestPermissions();
        }
        
        async function requestPermissions() {
            console.log("Requesting permissions...");
            
            // Check if we need to request permission for iOS 13+
            if (typeof DeviceOrientationEvent !== 'undefined' && 
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                console.log("iOS 13+ detected, requesting permission...");
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    console.log("Permission response:", permission);
                    if (permission === 'granted') {
                        setupGyroscope();
                        startGame();
                    } else {
                        console.log("Permission denied, falling back to touch controls");
                        alert('Motion permission denied. Using touch controls instead.');
                        useGyro = false;
                        document.getElementById('touchPad').style.display = 'block';
                        startGame();
                    }
                } catch (error) {
                    console.error('Error requesting permission:', error);
                    alert('Error requesting motion permission. Using touch controls.');
                    useGyro = false;
                    document.getElementById('touchPad').style.display = 'block';
                    startGame();
                }
            } else {
                console.log("No permission needed, setting up gyroscope...");
                // No permission needed on this device
                setupGyroscope();
                startGame();
            }
        }
        
        function setupGyroscope() {
            console.log("Setting up gyroscope...");
            let calibrated = false;
            let hasGyro = false;
            
            window.addEventListener('deviceorientation', (event) => {
                if (event.alpha !== null || event.beta !== null || event.gamma !== null) {
                    hasGyro = true;
                    useGyro = true;
                    
                    if (!calibrated && gameRunning) {
                        baseAlpha = event.alpha || 0;
                        baseBeta = event.beta || 0;
                        baseGamma = event.gamma || 0;
                        calibrated = true;
                        console.log("Gyroscope calibrated:", { baseAlpha, baseBeta, baseGamma });
                    }
                    
                    currentAlpha = event.alpha || 0;
                    currentBeta = event.beta || 0;
                    currentGamma = event.gamma || 0;
                }
            });
            
            // Check if gyro is working after a delay
            setTimeout(() => {
                if (!hasGyro) {
                    console.log("No gyroscope data detected, enabling touch controls");
                    useGyro = false;
                    document.getElementById('touchPad').style.display = 'block';
                    alert('Gyroscope not detected. Using touch controls.');
                }
            }, 1000);
        }
        
        function setupTouchControls() {
            const touchPad = document.getElementById('touchPad');
            const stick = document.getElementById('touchPadStick');
            let touching = false;
            
            touchPad.addEventListener('touchstart', (e) => {
                e.preventDefault();
                touching = true;
            });
            
            touchPad.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!touching) return;
                
                const touch = e.touches[0];
                const rect = touchPad.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                const x = touch.clientX - centerX;
                const y = touch.clientY - centerY;
                
                const maxDist = rect.width / 2;
                const dist = Math.min(Math.sqrt(x * x + y * y), maxDist);
                const angle = Math.atan2(y, x);
                
                const stickX = Math.cos(angle) * dist;
                const stickY = Math.sin(angle) * dist;
                
                stick.style.transform = `translate(${stickX - 30}px, ${stickY - 30}px)`;
                
                touchInput.x = (stickX / maxDist) * 10;
                touchInput.z = (stickY / maxDist) * 10;
            });
            
            touchPad.addEventListener('touchend', (e) => {
                e.preventDefault();
                touching = false;
                stick.style.transform = 'translate(-50%, -50%)';
                touchInput.x = 0;
                touchInput.z = 0;
            });
        }
        
        function startGame() {
            console.log("Starting game...");
            document.getElementById('startScreen').style.display = 'none';
            if (debugMode) {
                document.getElementById('debug').style.display = 'block';
            }
            score = 0;
            updateScore();
            gameRunning = true;
            
            // Clear previous game objects
            obstacles.forEach(obs => {
                world.removeRigidBody(obs.body);
                scene.remove(obs.mesh);
            });
            obstacles = [];
            
            if (playerBody) {
                world.removeRigidBody(playerBody);
                scene.remove(playerMesh);
            }
            
            // Create player
            const playerGeometry = new THREE.SphereGeometry(PLAYER_RADIUS, 32, 16);
            const playerMaterial = new THREE.MeshPhongMaterial({
                color: 0x00ff88,
                emissive: 0x00ff88,
                emissiveIntensity: 0.3,
                shininess: 100
            });
            playerMesh = new THREE.Mesh(playerGeometry, playerMaterial);
            scene.add(playerMesh);
            
            const playerBodyDesc = RAPIER.RigidBodyDesc.dynamic()
                .setTranslation(0, 0, 0);
            playerBody = world.createRigidBody(playerBodyDesc);
            
            const playerColliderDesc = RAPIER.ColliderDesc.ball(PLAYER_RADIUS);
            world.createCollider(playerColliderDesc, playerBody);
            
            // Create obstacles
            for (let i = 0; i < OBSTACLE_COUNT; i++) {
                createObstacle();
            }
            
            console.log("Game started, beginning animation loop");
            animate();
        }
        
        function createObstacle() {
            const geometry = new THREE.SphereGeometry(OBSTACLE_RADIUS, 32, 16);
            const material = new THREE.MeshPhongMaterial({
                color: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
                emissive: new THREE.Color().setHSL(Math.random(), 0.7, 0.5),
                emissiveIntensity: 0.2,
                transparent: true,
                opacity: 0.8
            });
            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);
            
            const x = (Math.random() - 0.5) * WORLD_SIZE;
            const y = (Math.random() - 0.5) * WORLD_SIZE;
            const z = (Math.random() - 0.5) * WORLD_SIZE;
            
            const bodyDesc = RAPIER.RigidBodyDesc.dynamic()
                .setTranslation(x, y, z);
            const body = world.createRigidBody(bodyDesc);
            
            const colliderDesc = RAPIER.ColliderDesc.ball(OBSTACLE_RADIUS);
            world.createCollider(colliderDesc, body);
            
            // Random velocity
            const vel = {
                x: (Math.random() - 0.5) * 2,
                y: (Math.random() - 0.5) * 2,
                z: (Math.random() - 0.5) * 2
            };
            body.setLinvel(vel, true);
            
            obstacles.push({ mesh, body });
        }
        
        function updateScore() {
            document.getElementById('score').textContent = `Score: ${score}`;
        }
        
        function updateDebug() {
            if (!debugMode) return;
            
            const debugDiv = document.getElementById('debug');
            debugDiv.innerHTML = `
                Gyro: ${useGyro ? 'Active' : 'Inactive'}<br>
                Alpha: ${currentAlpha.toFixed(1)}<br>
                Beta: ${currentBeta.toFixed(1)}<br>
                Gamma: ${currentGamma.toFixed(1)}<br>
                Touch X: ${touchInput.x.toFixed(1)}<br>
                Touch Z: ${touchInput.z.toFixed(1)}
            `;
        }
        
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = `Score: ${score}`;
            document.getElementById('gameOverScreen').style.display = 'flex';
            document.getElementById('debug').style.display = 'none';
        }
        
        function animate() {
            if (!gameRunning) return;
            
            requestAnimationFrame(animate);
            
            // Update physics
            world.step();
            
            // Apply input to player
            if (playerBody) {
                let inputX = 0, inputZ = 0;
                
                if (useGyro) {
                    // Gyroscope input
                    const tiltX = (currentGamma - baseGamma) * 0.3;
                    const tiltZ = (currentBeta - baseBeta) * 0.3;
                    
                    inputX = Math.max(-10, Math.min(10, tiltX));
                    inputZ = Math.max(-10, Math.min(10, tiltZ));
                } else {
                    // Touch input
                    inputX = touchInput.x;
                    inputZ = touchInput.z;
                }
                
                playerBody.setLinvel({ x: inputX, y: 0, z: inputZ }, true);
                
                // Update player mesh
                const playerPos = playerBody.translation();
                playerMesh.position.set(playerPos.x, playerPos.y, playerPos.z);
                
                // Keep player in bounds
                if (Math.abs(playerPos.x) > WORLD_SIZE / 2 || 
                    Math.abs(playerPos.y) > WORLD_SIZE / 2 || 
                    Math.abs(playerPos.z) > WORLD_SIZE / 2) {
                    playerBody.setTranslation({ x: 0, y: 0, z: 0 }, true);
                }
            }
            
            // Update obstacles
            obstacles.forEach((obstacle, index) => {
                const pos = obstacle.body.translation();
                obstacle.mesh.position.set(pos.x, pos.y, pos.z);
                
                // Wrap around world boundaries
                if (Math.abs(pos.x) > WORLD_SIZE / 2) {
                    obstacle.body.setTranslation({ x: -pos.x * 0.9, y: pos.y, z: pos.z }, true);
                }
                if (Math.abs(pos.y) > WORLD_SIZE / 2) {
                    obstacle.body.setTranslation({ x: pos.x, y: -pos.y * 0.9, z: pos.z }, true);
                }
                if (Math.abs(pos.z) > WORLD_SIZE / 2) {
                    obstacle.body.setTranslation({ x: pos.x, y: pos.y, z: -pos.z * 0.9 }, true);
                }
                
                // Check collision with player
                if (playerBody) {
                    const playerPos = playerBody.translation();
                    const distance = Math.sqrt(
                        Math.pow(pos.x - playerPos.x, 2) +
                        Math.pow(pos.y - playerPos.y, 2) +
                        Math.pow(pos.z - playerPos.z, 2)
                    );
                    
                    if (distance < PLAYER_RADIUS + OBSTACLE_RADIUS) {
                        gameOver();
                    }
                }
                
                // Rotate obstacles
                obstacle.mesh.rotation.x += 0.01;
                obstacle.mesh.rotation.y += 0.01;
            });
            
            // Rotate particles
            particles.rotation.y += 0.0005;
            
            // Update score
            score++;
            updateScore();
            updateDebug();
            
            // Render
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Initialize
        init().catch(error => {
            console.error("Failed to initialize game:", error);
            alert("Failed to initialize game. Please refresh the page.");
        });
    </script>
</body>
</html>
