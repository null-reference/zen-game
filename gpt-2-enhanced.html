<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gyro Collision Game</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #111 0%, #000 100%);
      font-family: 'Segoe UI', sans-serif;
      user-select: none;
    }

    canvas {
      display: block;
    }

    #permission {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #222;
      color: white;
      padding: 24px 36px;
      border-radius: 16px;
      font-size: 1.2rem;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
      cursor: pointer;
      transition: background 0.3s;
    }

    #permission:hover {
      background: #333;
    }

    #overlay {
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
      font-size: 16px;
      z-index: 10;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="permission">Tap to start game</div>
<div id="overlay"></div>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

  }));
}
