<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gyro 3D Bounce</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; background:#000; }
    #overlay { position:absolute; top:20px; left:20px; color:#0f0; font-family: Arial, sans-serif; z-index:10; }
    #permission { position: absolute; top:50%; left:50%; transform: translate(-50%, -50%); background:#222; color:white; padding:20px 30px; border-radius:10px; font-size:1.2rem; cursor:pointer; z-index:10; }
    canvas { display:block; }
  </style>
</head>
<body>
<div id="overlay"></div>
<div id="permission">Tap to start</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
<script type="module">
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

let scene, camera, renderer, world;
let playerMesh, playerBody;
const obstacles = [];
let targetTiltX = 0, targetTiltY = 0, tiltX = 0, tiltY = 0;
let collisionCount = 0;
let gameStarted = false;
const overlay = document.getElementById('overlay');

function init() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 100);
  camera.position.z = 15;
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(5,5,5);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));

  world = new CANNON.World({ gravity: new CANNON.Vec3(0,0,0) });

  const sphereShape = new CANNON.Sphere(1);
  playerBody = new CANNON.Body({ mass: 1, shape: sphereShape });
  world.addBody(playerBody);
  const sphereGeo = new THREE.SphereGeometry(1, 32, 32);
  const sphereMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
  playerMesh = new THREE.Mesh(sphereGeo, sphereMat);
  scene.add(playerMesh);

  for (let i=0; i<10; i++) {
    const size = 1 + Math.random()*1.5;
    const boxGeo = new THREE.BoxGeometry(size,size,size);
    const boxMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(`hsl(${Math.random()*360},70%,60%)`) });
    const mesh = new THREE.Mesh(boxGeo, boxMat);
    scene.add(mesh);

    const boxShape = new CANNON.Box(new CANNON.Vec3(size/2,size/2,size/2));
    const body = new CANNON.Body({ mass: 0.5, shape: boxShape });
    body.position.set((Math.random()-0.5)*12, (Math.random()-0.5)*12, (Math.random()-0.5)*12);
    body.velocity.set((Math.random()-0.5)*4, (Math.random()-0.5)*4, (Math.random()-0.5)*4);
    world.addBody(body);

    obstacles.push({ mesh, body, size });
  }

  window.addEventListener('resize', onResize);
  onResize();
  animate();
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function handleTilt(e) {
  if(!gameStarted) return;
  targetTiltX = e.gamma || 0;
  targetTiltY = e.beta || 0;
}

function applyControls(){
  tiltX += (targetTiltX - tiltX)*0.1;
  tiltY += (targetTiltY - tiltY)*0.1;
  const speed = 0.08;
  playerBody.velocity.x += tiltX * speed;
  playerBody.velocity.y += tiltY * speed;
  playerBody.velocity.x *= 0.98;
  playerBody.velocity.y *= 0.98;
}

function update(){
  if(!gameStarted) return;
  applyControls();
  world.step(1/60);

  // keep player within bounds
  const bound = 12;
  ['x','y','z'].forEach(axis=>{
    if(Math.abs(playerBody.position[axis])>bound){
      playerBody.position[axis]=Math.sign(playerBody.position[axis])*bound;
      playerBody.velocity[axis]*=-0.5;
    }
  });

  playerMesh.position.copy(playerBody.position);

  for(const o of obstacles){
    o.mesh.position.copy(o.body.position);
    if(Math.abs(o.body.position.x)>bound) o.body.velocity.x*=-1;
    if(Math.abs(o.body.position.y)>bound) o.body.velocity.y*=-1;
    if(Math.abs(o.body.position.z)>bound) o.body.velocity.z*=-1;
  }

  world.contacts.forEach(c => {
    if((c.bi===playerBody || c.bj===playerBody)){
      collisionCount++;
    }
  });

  overlay.innerText = `Collisions: ${collisionCount}`;
}

function animate(){
  requestAnimationFrame(animate);
  update();
  renderer.render(scene,camera);
}

async function enableMotion(){
  try{
    if(typeof DeviceOrientationEvent?.requestPermission==='function'){
      const res = await DeviceOrientationEvent.requestPermission();
      if(res!=='granted') return alert('Permission denied');
    }
    window.addEventListener('deviceorientation', handleTilt);
    gameStarted = true;
    document.getElementById('permission').style.display='none';
  }catch(err){
    alert('Motion permission failed');
    console.error(err);
  }
}

document.getElementById('permission').addEventListener('click', enableMotion);
init();
</script>
</body>
</html>
