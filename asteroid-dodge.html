<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asteroid Dodge</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      background: radial-gradient(circle at center, #111 0%, #000 100%);
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 20px;
    }
    #gameover {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 32px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="score">0</div>
  <div id="gameover">Game Over<br/><a href="asteroid-dodge.html" style="color:yellow;">Restart</a></div>
  <canvas id="game"></canvas>
  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const player = { x: width / 2, y: height - 60, radius: 20, speed: 6 };
    const keys = {};
    const asteroids = [];
    let score = 0;
    let running = true;

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      player.y = height - 60;
    });

    function spawnAsteroid() {
      const radius = 15 + Math.random() * 20;
      asteroids.push({
        x: Math.random() * width,
        y: -radius,
        radius,
        speed: 2 + Math.random() * 3
      });
    }
    setInterval(spawnAsteroid, 800);

    function update() {
      if (!running) return;
      if (keys['ArrowLeft']) player.x -= player.speed;
      if (keys['ArrowRight']) player.x += player.speed;
      player.x = Math.max(player.radius, Math.min(width - player.radius, player.x));

      for (let a of asteroids) {
        a.y += a.speed;
      }
      while (asteroids.length && asteroids[0].y - asteroids[0].radius > height) {
        asteroids.shift();
        score += 1;
        document.getElementById('score').textContent = score;
      }
      for (let a of asteroids) {
        const dx = a.x - player.x;
        const dy = a.y - player.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < a.radius + player.radius) {
          running = false;
          document.getElementById('gameover').style.display = 'block';
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);
      // draw player
      ctx.fillStyle = '#0f0';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      // draw asteroids
      ctx.fillStyle = '#888';
      for (let a of asteroids) {
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
