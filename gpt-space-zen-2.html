<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPT Space Zen 2</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at center, #000011 0%, #000000 100%);
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;const GRAVITY_CONSTANT = 0.05;

const gravityAnchors = [
  { x: 300, y: 300, gravity: 1000, color: '#ff00ff' },
  { x: 800, y: 500, gravity: 1500, color: '#00ffff' },
];

const orbs = [];

class Orb {
  constructor(x, y, vx, vy) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.radius = 5;
    this.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
  }

  update() {
    gravityAnchors.forEach(anchor => {
      const dx = anchor.x - this.x;
      const dy = anchor.y - this.y;
      const distSq = dx * dx + dy * dy;
      const force = (anchor.gravity * GRAVITY_CONSTANT) / distSq;
      const angle = Math.atan2(dy, dx);
      this.vx += Math.cos(angle) * force;
      this.vy += Math.sin(angle) * force;
    });
    this.x += this.vx;
    this.y += this.vy;
  }

  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, 2 * Math.PI);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
}

function drawAnchors() {
  gravityAnchors.forEach(anchor => {
    const pulse = 0.3 * Math.sin(Date.now() / 200) + 1.2;
    ctx.beginPath();
    ctx.arc(anchor.x, anchor.y, 20 * pulse, 0, 2 * Math.PI);
    ctx.fillStyle = anchor.color;
    ctx.fill();
    ctx.shadowBlur = 20;
    ctx.shadowColor = anchor.color;
  });
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawAnchors();
  orbs.forEach(orb => {
    orb.update();
    orb.draw();
  });

  requestAnimationFrame(gameLoop);
}

canvas.addEventListener('click', e => {
  const angle = Math.random() * Math.PI * 2;
  const speed = Math.random() * 3 + 1;
  const vx = Math.cos(angle) * speed;
  const vy = Math.sin(angle) * speed;
  orbs.push(new Orb(e.clientX, e.clientY, vx, vy));
});

gameLoop();

  </script>
</body>
</html>
