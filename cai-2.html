<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gyro Dodge Endless</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(to bottom, #1a1a2e, #16213e);
      font-family: 'Press Start 2P', cursive;
      color: white;
    }
    canvas {
      display: block;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
    }
    #permission {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 25px 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
      border: 2px solid cyan;
      font-size: 1.2em;
      z-index: 10;
    }
    #permission button {
      background: #00bcd4;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
      margin-top: 20px;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    #permission button:hover {
      background: #0097a7;
      transform: scale(1.05);
    }
    #gameStats {
      position: absolute;
      top: 20px;
      left: 20px;
      background: none;
      box-shadow: none;
      border: none;
      padding: 0;
      text-align: left;
      font-size: 1em;
      z-index: 5;
    }
    #gameStats span {
      display: block;
      margin-bottom: 5px;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="canvas"></canvas>
<div id="permission">
  <h2>Gyro Dodge</h2>
  <p>Tap to enable motion sensors and start dodging!</p>
  <button id="startButton">Start Game</button>
</div>
<div id="gameStats">
  <span id="timeDisplay">Time: 0s</span>
  <span id="collisionDisplay">Collisions: 0</span>
  <span id="comboDisplay">Combo: 0</span>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let targetTiltX = 0;
let targetTiltY = 0;
let tiltX = 0;
let tiltY = 0;

let initialGamma = 0;
let initialBeta = 0;
let hasBaseline = false;

let player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  radius: 14,
  color: "#00e676",
  speedMultiplier: 0.7,
  invulnerable: false,
  invulnerabilityTimer: 0
};

let collisionCount = 0;
let startTime = 0;
let gameRunning = false;
let animationFrameId;

// Enhanced collision system variables
let screenShake = { x: 0, y: 0, intensity: 0, duration: 0 };
let particles = [];
let combo = 0;
let comboTimer = 0;
let lastCollisionTime = 0;

const obstacleBaseSpeed = 1;
const obstacleCount = 25;
let obstacles = [];

const timeDisplay = document.getElementById("timeDisplay");
const collisionDisplay = document.getElementById("collisionDisplay");
const comboDisplay = document.getElementById("comboDisplay");
const permissionScreen = document.getElementById("permission");
const startButton = document.getElementById("startButton");

// Particle system for collision effects
class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 12;
    this.vy = (Math.random() - 0.5) * 12;
    this.life = 1.0;
    this.decay = 0.02 + Math.random() * 0.03;
    this.size = 2 + Math.random() * 4;
    this.color = color;
    this.gravity = 0.1;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy += this.gravity;
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.life -= this.decay;
    this.size *= 0.98;
  }

  draw() {
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Create explosion particles
function createExplosion(x, y, color, count = 15) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, color));
  }
}

// Screen shake effect
function addScreenShake(intensity, duration) {
  screenShake.intensity = Math.max(screenShake.intensity, intensity);
  screenShake.duration = Math.max(screenShake.duration, duration);
}

function updateScreenShake() {
  if (screenShake.duration > 0) {
    screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
    screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
    screenShake.duration--;
    screenShake.intensity *= 0.9;
  } else {
    screenShake.x = 0;
    screenShake.y = 0;
  }
}

// Combo system
function updateCombo() {
  const currentTime = Date.now();
  if (currentTime - lastCollisionTime > 2000) { // Reset combo after 2 seconds
    combo = 0;
  }
  
  if (comboTimer > 0) {
    comboTimer--;
  }
  
  comboDisplay.textContent = `Combo: ${combo}`;
}

function addCombo() {
  combo++;
  comboTimer = 60; // Visual effect duration
  lastCollisionTime = Date.now();
}

// Game Initialization
function initializeGame() {
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
  player.invulnerable = false;
  player.invulnerabilityTimer = 0;
  collisionCount = 0;
  combo = 0;
  comboTimer = 0;
  startTime = Date.now();
  gameRunning = true;
  hasBaseline = false;
  particles = [];
  screenShake = { x: 0, y: 0, intensity: 0, duration: 0 };
  
  obstacles = Array.from({ length: obstacleCount }).map(() => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: 10 + Math.random() * 10,
    dx: (Math.random() - 0.5) * obstacleBaseSpeed * 2,
    dy: (Math.random() - 0.5) * obstacleBaseSpeed * 2,
    color: `hsl(${Math.random() * 360}, 80%, 70%)`,
    wasColliding: false,
    collisionEffect: false,
    effectTimer: 0,
    hitCount: 0,
    scale: 1
  }));

  permissionScreen.style.display = "none";
  timeDisplay.textContent = `Time: 0s`;
  collisionDisplay.textContent = `Collisions: 0`;
  comboDisplay.textContent = `Combo: 0`;

  if (animationFrameId) {
    cancelAnimationFrame(animationFrameId);
  }
  loop();
}

// Motion Permission
function enableMotion() {
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission().then(response => {
      if (response === "granted") {
        window.addEventListener("deviceorientation", handleTilt, true);
        initializeGame();
      } else {
        alert("Motion sensor permission denied. Game cannot start.");
      }
    }).catch(error => {
      console.error("DeviceOrientationEvent.requestPermission failed:", error);
      alert("Error requesting motion sensor permission.");
    });
  } else {
    window.addEventListener("deviceorientation", handleTilt, true);
    initializeGame();
  }
}

startButton.addEventListener("click", enableMotion);

// Tilt Handling
function handleTilt(e) {
  if (!hasBaseline) {
    initialGamma = e.gamma || 0;
    initialBeta = e.beta || 0;
    hasBaseline = true;
  }

  const rawTargetTiltX = ((e.gamma || 0) - initialGamma);
  const rawTargetTiltY = ((e.beta || 0) - initialBeta);

  const deadzone = 1;
  targetTiltX = Math.abs(rawTargetTiltX) > deadzone ? rawTargetTiltX : 0;
  targetTiltY = Math.abs(rawTargetTiltY) > deadzone ? rawTargetTiltY : 0;
}

// Collision Detection
function checkCollision(p, o) {
  const dx = p.x - o.x;
  const dy = p.y - o.y;
  const distance = Math.sqrt(dx * dx + dy * dy);
  return distance < p.radius + o.r;
}

// Game Logic Update
function update() {
  if (!gameRunning) return;

  // Update player invulnerability
  if (player.invulnerabilityTimer > 0) {
    player.invulnerabilityTimer--;
    if (player.invulnerabilityTimer <= 0) {
      player.invulnerable = false;
      player.color = "#00e676";
    }
  }

  // Smooth player movement
  tiltX += (targetTiltX - tiltX) * 0.15;
  tiltY += (targetTiltY - tiltY) * 0.15;

  player.x += tiltX * player.speedMultiplier;
  player.y += tiltY * player.speedMultiplier;

  // Keep player within bounds with bounce effect
  if (player.x < player.radius) {
    player.x = player.radius;
    tiltX = -tiltX * 0.5;
  }
  if (player.x > canvas.width - player.radius) {
    player.x = canvas.width - player.radius;
    tiltX = -tiltX * 0.5;
  }
  if (player.y < player.radius) {
    player.y = player.radius;
    tiltY = -tiltY * 0.5;
  }
  if (player.y > canvas.height - player.radius) {
    player.y = canvas.height - player.radius;
    tiltY = -tiltY * 0.5;
  }

  // Update obstacles and collision detection
  for (let o of obstacles) {
    o.x += o.dx;
    o.y += o.dy;

    // Obstacle boundary collision with bounce
    if (o.x < o.r || o.x > canvas.width - o.r) o.dx *= -1;
    if (o.y < o.r || o.y > canvas.height - o.r) o.dy *= -1;

    // Update obstacle scale animation
    o.scale += (1 - o.scale) * 0.1;

    const isColliding = checkCollision(player, o);
    if (isColliding && !player.invulnerable) {
      if (!o.wasColliding) {
        // COLLISION HAPPENED! Make it satisfying
        collisionCount++;
        addCombo();
        
        // Create particle explosion
        createExplosion(o.x, o.y, o.color, 20);
        createExplosion(player.x, player.y, player.color, 15);
        
        // Screen shake based on combo
        const shakeIntensity = Math.min(5 + combo * 0.5, 15);
        addScreenShake(shakeIntensity, 15);
        
        // Obstacle effects
        o.collisionEffect = true;
        o.effectTimer = 45;
        o.hitCount++;
        o.scale = 1.3; // Pop effect
        
        // Player feedback
        player.color = "#ff4444";
        player.invulnerable = true;
        player.invulnerabilityTimer = 30; // Brief invulnerability
        
        // Obstacle gets faster and changes color after hits
        if (o.hitCount >= 3) {
          o.color = `hsl(${Math.random() * 60}, 100%, 50%)`; // Hot colors
          o.dx *= 1.2;
          o.dy *= 1.2;
        }
        
        // Knockback effect
        const angle = Math.atan2(player.y - o.y, player.x - o.x);
        const knockbackForce = 3 + combo * 0.5;
        player.x += Math.cos(angle) * knockbackForce;
        player.y += Math.sin(angle) * knockbackForce;
        
        // Obstacle rebound
        o.dx += Math.cos(angle + Math.PI) * 2;
        o.dy += Math.sin(angle + Math.PI) * 2;
      }
    }
    o.wasColliding = isColliding;

    // Update collision effect timer
    if (o.collisionEffect) {
      o.effectTimer--;
      if (o.effectTimer <= 0) {
        o.collisionEffect = false;
      }
    }
  }

  // Update particles
  particles = particles.filter(p => {
    p.update();
    return p.life > 0;
  });

  // Update screen shake
  updateScreenShake();
  
  // Update combo system
  updateCombo();

  // Update stats display
  timeDisplay.textContent = `Time: ${Math.floor((Date.now() - startTime) / 1000)}s`;
  collisionDisplay.textContent = `Collisions: ${collisionCount}`;
}

// Drawing
function draw() {
  // Apply screen shake
  ctx.save();
  ctx.translate(screenShake.x, screenShake.y);
  
  ctx.clearRect(-screenShake.x, -screenShake.y, canvas.width + Math.abs(screenShake.x) * 2, canvas.height + Math.abs(screenShake.y) * 2);

  // Draw obstacles
  for (let o of obstacles) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.scale(o.scale, o.scale);
    
    ctx.beginPath();
    if (o.collisionEffect) {
      // Flashing effect during collision
      const flash = Math.sin(o.effectTimer * 0.5) > 0;
      ctx.fillStyle = flash ? "white" : o.color;
      ctx.shadowBlur = 20;
      ctx.shadowColor = "white";
    } else {
      ctx.fillStyle = o.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = o.color;
    }
    
    ctx.arc(0, 0, o.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  }

  // Draw particles
  particles.forEach(p => p.draw());

  // Draw player with invulnerability flashing
  if (!player.invulnerable || Math.floor(Date.now() / 100) % 2) {
    ctx.beginPath();
    ctx.fillStyle = player.color;
    ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
    ctx.shadowBlur = 15;
    ctx.shadowColor = player.color;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Draw combo multiplier effect
  if (comboTimer > 0) {
    ctx.save();
    ctx.font = "16px 'Press Start 2P'";
    ctx.fillStyle = `rgba(255, 255, 0, ${comboTimer / 60})`;
    ctx.textAlign = "center";
    const comboY = 100 + Math.sin(comboTimer * 0.2) * 10;
    ctx.fillText(`COMBO x${combo}!`, canvas.width / 2, comboY);
    ctx.restore();
  }

  ctx.restore(); // Restore screen shake transform
}

// Game Loop
function loop() {
  update();
  draw();
  animationFrameId = requestAnimationFrame(loop);
}

// Initial state
permissionScreen.style.display = "block";

// Handle window resizing
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (gameRunning) {
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
  }
});
</script>
</body>
</html>
