<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Drift - Gyro Collision Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #0a0a1f 0%, #000000 100%);
      font-family: 'Orbitron', monospace;
      user-select: none;
    }

    canvas {
      display: block;
      position: relative;
    }

    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #permission {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      color: #00ffff;
      padding: 30px 40px;
      border-radius: 20px;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 18px;
      display: none;
      cursor: pointer;
      border: 2px solid #00ffff;
      box-shadow: 
        0 0 30px rgba(0, 255, 255, 0.3),
        inset 0 0 20px rgba(0, 255, 255, 0.1);
      text-align: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    #permission:hover {
      background: linear-gradient(135deg, #2a2a3e 0%, #26314e 50%, #1f1f33 100%);
      box-shadow: 
        0 0 50px rgba(0, 255, 255, 0.5),
        inset 0 0 30px rgba(0, 255, 255, 0.2);
      transform: translate(-50%, -50%) scale(1.05);
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 20px;
      color: #00ffff;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      text-shadow: 
        0 0 10px rgba(0, 255, 255, 0.8),
        0 0 20px rgba(0, 255, 255, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .stat {
      background: rgba(0, 20, 40, 0.8);
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      margin: 5px;
      font-size: 16px;
      box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
    }

    #gameOver {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      color: #00ffff;
      padding: 40px;
      border-radius: 25px;
      font-family: 'Orbitron', monospace;
      text-align: center;
      border: 3px solid #ff0080;
      box-shadow: 
        0 0 50px rgba(255, 0, 128, 0.5),
        inset 0 0 30px rgba(255, 0, 128, 0.1);
      backdrop-filter: blur(15px);
      z-index: 200;
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    #gameOver.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    #gameOver h2 {
      font-size: 32px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(255, 0, 128, 0.8);
      font-weight: 900;
    }

    #gameOver .score {
      font-size: 24px;
      margin: 10px 0;
      color: #ffffff;
    }

    #restartBtn {
      background: linear-gradient(135deg, #ff0080, #8000ff);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 15px;
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(255, 0, 128, 0.3);
    }

    #restartBtn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 30px rgba(255, 0, 128, 0.6);
    }

    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes glow {
      0%, 100% { filter: brightness(1) saturate(1); }
      50% { filter: brightness(1.3) saturate(1.5); }
    }
  </style>
</head>
<body>
<div id="gameContainer">
  <canvas id="canvas"></canvas>
  
  <div id="ui">
    <div>
      <div class="stat">TIME: <span id="timeDisplay">0</span>s</div>
      <div class="stat">HITS: <span id="hitDisplay">0</span></div>
      <div class="stat">SCORE: <span id="scoreDisplay">0</span></div>
    </div>
    <div>
      <div class="stat">LEVEL: <span id="levelDisplay">1</span></div>
      <div class="stat">SPEED: <span id="speedDisplay">1.0</span>x</div>
    </div>
  </div>

  <div id="permission">
    <div style="font-size: 24px; margin-bottom: 10px;">🎮 NEON DRIFT 🎮</div>
    <div>Tap to enable motion controls</div>
    <div style="font-size: 14px; margin-top: 15px; opacity: 0.8;">
      Tilt your device to navigate through the neon chaos!
    </div>
  </div>

  <div id="gameOver">
    <h2>🏆 GAME COMPLETE 🏆</h2>
    <div class="score">Final Score: <span id="finalScore">0</span></div>
    <div class="score">Total Hits: <span id="finalHits">0</span></div>
    <div class="score">Survival Time: <span id="finalTime">0</span>s</div>
    <div class="score">Max Level: <span id="finalLevel">1</span></div>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Game state
let gameState = 'playing';
let targetTiltX = 0;
let targetTiltY = 0;
let tiltX = 0;
let tiltY = 0;
let initialGamma = 0;
let initialBeta = 0;
let hasBaseline = false;

// Game metrics
let collisionCount = 0;
let score = 0;
let level = 1;
let speedMultiplier = 1.0;
let startTime = Date.now();
let lastLevelUp = 0;

// Visual effects
let particles = [];
let shakeAmount = 0;
let backgroundHue = 0;

// Player object with enhanced properties
let player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  radius: 16,
  color: "#00ffff",
  glowRadius: 30,
  trail: [],
  invulnerable: 0,
  pulsePhase: 0
};

// Enhanced obstacles with more variety
let obstacles = [];

// Particle system
class Particle {
  constructor(x, y, color, size = 2) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.color = color;
    this.size = size;
    this.life = 1.0;
    this.decay = 0.02 + Math.random() * 0.03;
    this.alpha = 1.0;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.98;
    this.vy *= 0.98;
    this.life -= this.decay;
    this.alpha = this.life;
    this.size *= 0.99;
  }

  draw() {
    if (this.life <= 0) return;
    
    ctx.save();
    ctx.globalAlpha = this.alpha;
    
    // Glow effect
    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
    gradient.addColorStop(0, this.color);
    gradient.addColorStop(1, this.color.replace('1)', '0)'));
    
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
    ctx.fill();
    
    // Core particle
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.restore();
  }
}

function createParticleExplosion(x, y, color, count = 15) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, color, 1 + Math.random() * 3));
  }
}

function spawnObstacles() {
  obstacles = [];
  const baseCount = 15 + level * 2;
  
  for (let i = 0; i < baseCount; i++) {
    let x, y;
    do {
      x = 50 + Math.random() * (canvas.width - 100);
      y = 50 + Math.random() * (canvas.height - 100);
    } while (Math.hypot(x - player.x, y - player.y) < 150);

    const obstacleTypes = ['normal', 'fast', 'large', 'bouncy'];
    const type = obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];
    
    let obstacle = {
      x: x,
      y: y,
      r: 8 + Math.random() * 8,
      dx: (-2 + Math.random() * 4) * speedMultiplier,
      dy: (-2 + Math.random() * 4) * speedMultiplier,
      color: `hsl(${Math.random() * 360}, 85%, 65%)`,
      wasColliding: false,
      type: type,
      pulsePhase: Math.random() * Math.PI * 2,
      rotation: 0,
      rotationSpeed: (Math.random() - 0.5) * 0.2
    };

    // Apply type-specific properties
    switch (type) {
      case 'fast':
        obstacle.dx *= 1.5;
        obstacle.dy *= 1.5;
        obstacle.color = '#ff4444';
        obstacle.r *= 0.8;
        break;
      case 'large':
        obstacle.r *= 1.8;
        obstacle.dx *= 0.6;
        obstacle.dy *= 0.6;
        obstacle.color = '#ff8800';
        break;
      case 'bouncy':
        obstacle.color = '#44ff44';
        obstacle.bounciness = 1.2;
        break;
    }

    obstacles.push(obstacle);
  }
}

function enableMotion() {
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission().then(response => {
      if (response === "granted") {
        window.addEventListener("deviceorientation", handleTilt, true);
        document.getElementById("permission").style.display = "none";
        startGame();
      }
    });
  } else {
    window.addEventListener("deviceorientation", handleTilt, true);
    document.getElementById("permission").style.display = "none";
    startGame();
  }
}

function startGame() {
  spawnObstacles();
  startTime = Date.now();
  gameState = 'playing';
}

document.getElementById("permission").style.display = "block";
document.getElementById("permission").addEventListener("click", enableMotion);

function handleTilt(e) {
  if (!hasBaseline) {
    initialGamma = e.gamma || 0;
    initialBeta = e.beta || 0;
    hasBaseline = true;
  }

  targetTiltX = ((e.gamma || 0) - initialGamma) || 0;
  targetTiltY = ((e.beta || 0) - initialBeta) || 0;
  
  // Increase sensitivity
  targetTiltX *= 1.5;
  targetTiltY *= 1.5;
}

function checkCollision(p, o) {
  const dx = p.x - o.x;
  const dy = p.y - o.y;
  const distance = Math.sqrt(dx * dx + dy * dy);
  return distance < p.radius + o.r;
}

function updatePlayer() {
  // Smooth tilt interpolation
  tiltX += (targetTiltX - tiltX) * 0.15;
  tiltY += (targetTiltY - tiltY) * 0.15;

  // Enhanced movement with screen shake consideration
  const shakeX = (Math.random() - 0.5) * shakeAmount;
  const shakeY = (Math.random() - 0.5) * shakeAmount;
  
  player.x += (tiltX * 0.8) + shakeX;
  player.y += (tiltY * 0.8) + shakeY;

  // Boundary collision with bounce effect
  if (player.x < player.radius) {
    player.x = player.radius;
    createParticleExplosion(player.x, player.y, 'rgba(0, 255, 255, 1)', 8);
  }
  if (player.x > canvas.width - player.radius) {
    player.x = canvas.width - player.radius;
    createParticleExplosion(player.x, player.y, 'rgba(0, 255, 255, 1)', 8);
  }
  if (player.y < player.radius) {
    player.y = player.radius;
    createParticleExplosion(player.x, player.y, 'rgba(0, 255, 255, 1)', 8);
  }
  if (player.y > canvas.height - player.radius) {
    player.y = canvas.height - player.radius;
    createParticleExplosion(player.x, player.y, 'rgba(0, 255, 255, 1)', 8);
  }

  // Update trail
  player.trail.push({ x: player.x, y: player.y, alpha: 1.0 });
  if (player.trail.length > 15) player.trail.shift();
  
  // Fade trail
  player.trail.forEach((point, index) => {
    point.alpha = index / player.trail.length;
  });

  // Update pulse effect
  player.pulsePhase += 0.15;
  
  // Reduce invulnerability
  if (player.invulnerable > 0) player.invulnerable--;
  
  // Reduce screen shake
  shakeAmount *= 0.9;
}

function updateObstacles() {
  obstacles.forEach(o => {
    // Update position
    o.x += o.dx;
    o.y += o.dy;
    o.rotation += o.rotationSpeed;
    o.pulsePhase += 0.1;

    // Enhanced boundary collision
    if (o.x < o.r || o.x > canvas.width - o.r) {
      o.dx *= -(o.bounciness || 1);
      createParticleExplosion(o.x, o.y, o.color, 5);
    }
    if (o.y < o.r || o.y > canvas.height - o.r) {
      o.dy *= -(o.bounciness || 1);
      createParticleExplosion(o.x, o.y, o.color, 5);
    }

    // Keep in bounds
    o.x = Math.max(o.r, Math.min(canvas.width - o.r, o.x));
    o.y = Math.max(o.r, Math.min(canvas.height - o.r, o.y));

    // Collision detection
    const isColliding = checkCollision(player, o);
    if (isColliding && !o.wasColliding && player.invulnerable === 0) {
      // Collision response
      const angle = Math.atan2(o.y - player.y, o.x - player.x);
      const speed = 3 + Math.random() * 2;
      o.dx = Math.cos(angle) * speed * speedMultiplier + (Math.random() - 0.5);
      o.dy = Math.sin(angle) * speed * speedMultiplier + (Math.random() - 0.5);
      
      collisionCount++;
      score += 10 * level;
      shakeAmount = 20;
      player.invulnerable = 30;
      
      // Create explosion effect
      createParticleExplosion(
        (player.x + o.x) / 2, 
        (player.y + o.y) / 2, 
        o.color, 
        20
      );
    }
    o.wasColliding = isColliding;
  });
}

function updateGame() {
  if (gameState !== 'playing') return;

  updatePlayer();
  updateObstacles();
  
  // Update particles
  particles = particles.filter(p => {
    p.update();
    return p.life > 0;
  });

  // Level progression
  const currentTime = (Date.now() - startTime) / 1000;
  const newLevel = Math.floor(currentTime / 15) + 1;
  
  if (newLevel > level) {
    level = newLevel;
    speedMultiplier = 1 + (level - 1) * 0.2;
    
    // Add more obstacles
    if (obstacles.length < 50) {
      for (let i = 0; i < 3; i++) {
        let x, y;
        do {
          x = 50 + Math.random() * (canvas.width - 100);
          y = 50 + Math.random() * (canvas.height - 100);
        } while (Math.hypot(x - player.x, y - player.y) < 100);

        obstacles.push({
          x: x,
          y: y,
          r: 6 + Math.random() * 12,
          dx: (-3 + Math.random() * 6) * speedMultiplier,
          dy: (-3 + Math.random() * 6) * speedMultiplier,
          color: `hsl(${Math.random() * 360}, 85%, 65%)`,
          wasColliding: false,
          type: 'normal',
          pulsePhase: Math.random() * Math.PI * 2,
          rotation: 0,
          rotationSpeed: (Math.random() - 0.5) * 0.2
        });
      }
    }
  }

  // Update background hue
  backgroundHue += 0.5;
  if (backgroundHue >= 360) backgroundHue = 0;

  // Game over condition (optional - after 5 minutes or level 20)
  if (currentTime > 300 || level >= 20) {
    endGame();
  }
}

function endGame() {
  gameState = 'gameOver';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalHits').textContent = collisionCount;
  document.getElementById('finalTime').textContent = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById('finalLevel').textContent = level;
  document.getElementById('gameOver').classList.add('show');
}

function drawBackground() {
  // Animated gradient background
  const gradient = ctx.createRadialGradient(
    canvas.width / 2, canvas.height / 2, 0,
    canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height)
  );
  
  gradient.addColorStop(0, `hsl(${backgroundHue}, 20%, 8%)`);
  gradient.addColorStop(0.5, `hsl(${(backgroundHue + 60) % 360}, 30%, 5%)`);
  gradient.addColorStop(1, '#000000');
  
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Grid effect
  ctx.strokeStyle = `hsla(${backgroundHue}, 50%, 15%, 0.3)`;
  ctx.lineWidth = 1;
  const gridSize = 50;
  
  for (let x = 0; x < canvas.width; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  
  for (let y = 0; y < canvas.height; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function drawPlayer() {
  ctx.save();
  
  // Trail effect
  player.trail.forEach((point, index) => {
    if (index === 0) return;
    
    ctx.globalAlpha = point.alpha * 0.6;
    const size = player.radius * (point.alpha * 0.5 + 0.3);
    
    const gradient = ctx.createRadialGradient(point.x, point.y, 0, point.x, point.y, size * 2);
    gradient.addColorStop(0, 'rgba(0, 255, 255, 0.8)');
    gradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
    
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
    ctx.fill();
  });
  
  ctx.globalAlpha = 1;
  
  // Invulnerability effect
  if (player.invulnerable > 0 && Math.floor(player.invulnerable / 5) % 2) {
    ctx.globalAlpha = 0.5;
  }
  
  // Outer glow
  const glowSize = player.glowRadius + Math.sin(player.pulsePhase) * 5;
  const glowGradient = ctx.createRadialGradient(
    player.x, player.y, 0,
    player.x, player.y, glowSize
  );
  glowGradient.addColorStop(0, 'rgba(0, 255, 255, 0.4)');
  glowGradient.addColorStop(0.7, 'rgba(0, 255, 255, 0.1)');
  glowGradient.addColorStop(1, 'rgba(0, 255, 255, 0)');
  
  ctx.fillStyle = glowGradient;
  ctx.beginPath();
  ctx.arc(player.x, player.y, glowSize, 0, Math.PI * 2);
  ctx.fill();
  
  // Main player body
  const playerSize = player.radius + Math.sin(player.pulsePhase) * 2;
  const playerGradient = ctx.createRadialGradient(
    player.x - playerSize * 0.3, player.y - playerSize * 0.3, 0,
    player.x, player.y, playerSize
  );
  playerGradient.addColorStop(0, '#ffffff');
  playerGradient.addColorStop(0.3, '#00ffff');
  playerGradient.addColorStop(1, '#0088cc');
  
  ctx.fillStyle = playerGradient;
  ctx.beginPath();
  ctx.arc(player.x, player.y, playerSize, 0, Math.PI * 2);
  ctx.fill();
  
  // Inner core
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(player.x, player.y, playerSize * 0.4, 0, Math.PI * 2);
  ctx.fill();
  
  ctx.restore();
}

function drawObstacles() {
  obstacles.forEach(o => {
    ctx.save();
    
    // Outer glow
    const glowSize = o.r * 2 + Math.sin(o.pulsePhase) * 3;
    const glowGradient = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, glowSize);
    glowGradient.addColorStop(0, o.color.replace(')', ', 0.3)'));
    glowGradient.addColorStop(1, o.color.replace(')', ', 0)'));
    
    ctx.fillStyle = glowGradient;
    ctx.beginPath();
    ctx.arc(o.x, o.y, glowSize, 0, Math.PI * 2);
    ctx.fill();
    
    // Main obstacle
    ctx.translate(o.x, o.y);
    ctx.rotate(o.rotation);
    
    const size = o.r + Math.sin(o.pulsePhase) * 1;
    const gradient = ctx.createRadialGradient(-size * 0.3, -size * 0.3, 0, 0, 0, size);
    gradient.addColorStop(0, '#ffffff');
    gradient.addColorStop(0.4, o.color);
    gradient.addColorStop(1, o.color.replace('65%', '35%'));
    
    ctx.fillStyle = gradient;
    
    // Different shapes based on type
    switch (o.type) {
      case 'fast':
        // Triangle
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(-size * 0.8, size * 0.5);
        ctx.lineTo(size * 0.8, size * 0.5);
        ctx.closePath();
        ctx.fill();
        break;
      case 'large':
        // Hexagon
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = (i * Math.PI) / 3;
          const x = Math.cos(angle) * size;
          const y = Math.sin(angle) * size;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        break;
      case 'bouncy':
        // Square
        ctx.fillRect(-size, -size, size * 2, size * 2);
        break;
      default:
        // Circle
        ctx.beginPath();
        ctx.arc(0, 0, size, 0, Math.PI * 2);
        ctx.fill();
    }
    
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => p.draw());
}

function updateUI() {
  const currentTime = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById('timeDisplay').textConte
