<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Catch the Circle</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      height: 100%;
      background: #111;
    }
    canvas {
      display: block;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: sans-serif;
      font-size: 20px;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="score">Score: 0</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let score = 0;
let target = null;
let spawnDelay = 1000;

function randomTarget() {
  const x = Math.random() * canvas.width;
  const y = Math.random() * canvas.height;
  return {
    x,
    y,
    radius: 5,
    maxRadius: 100,
    speed: 0.5 + Math.random(),
    hit: false
  };
}

function drawCircle(c) {
  ctx.beginPath();
  ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
  ctx.fillStyle = 'lime';
  ctx.fill();
}

function update(delta) {
  if (!target) return;

  target.radius += target.speed * delta;
  if (target.radius >= target.maxRadius) {
    target = null; // missed it
  }
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (target) drawCircle(target);
}

let lastTime = 0;
function gameLoop(time) {
  const delta = time - lastTime;
  lastTime = time;
  update(delta);
  draw();
  requestAnimationFrame(gameLoop);
}

canvas.addEventListener('click', e => {
  if (target) {
    const dx = e.clientX - target.x;
    const dy = e.clientY - target.y;
    if (Math.sqrt(dx * dx + dy * dy) <= target.radius) {
      score++;
      document.getElementById('score').innerText = `Score: ${score}`;
      target = null;
    }
  }
});

setInterval(() => {
  if (!target) target = randomTarget();
}, spawnDelay);

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
