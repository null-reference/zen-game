<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gyro Wave</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: black;
      touch-action: none;
    }
    canvas {
      display: block;
    }
    #permission {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: #222;
      border: 1px solid #555;
      padding: 20px 30px;
      font-size: 18px;
      font-family: sans-serif;
      border-radius: 10px;
      display: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="permission">Tap to enable motion</div>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let tiltX = 0;

// Handle motion permission on iOS
function enableMotion() {
  const button = document.getElementById('permission');
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(response => {
        if (response === 'granted') {
          window.addEventListener("deviceorientation", handleOrientation, true);
          button.style.display = "none";
        }
      })
      .catch(console.error);
  } else {
    window.addEventListener("deviceorientation", handleOrientation, true);
    button.style.display = "none";
  }
}

document.getElementById("permission").style.display = "block";
document.getElementById("permission").addEventListener("click", enableMotion);

// Handle gyro input
function handleOrientation(event) {
  tiltX = event.gamma || 0; // gamma is left-right tilt when phone is flat
}

let time = 0;

function draw() {
  time += 0.02;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const lines = 40;
  const amplitude = 50;
  const frequency = 0.02;
  const waveOffset = tiltX * 0.2; // wiggle strength

  for (let i = 0; i < lines; i++) {
    const y = (canvas.height / lines) * i;
    ctx.beginPath();
    for (let x = 0; x < canvas.width; x += 5) {
      const wave =
        Math.sin((x + time * 100 + i * 10 + waveOffset * 50) * frequency) *
        amplitude;
      ctx.lineTo(x, y + wave);
    }
    ctx.strokeStyle = `hsl(${(time * 40 + i * 10) % 360}, 100%, 60%)`;
    ctx.stroke();
  }

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
