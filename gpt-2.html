<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sloshy Gyro Waves</title>
  <style>
    html, body {
      margin: 0;
      background: black;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #permission {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: #222;
      padding: 20px 30px;
      border-radius: 12px;
      font-family: sans-serif;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="permission">Tap to enable motion</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let gammaTilt = 0;
let betaTilt = 0;

let targetTiltX = 0;
let targetTiltY = 0;
let tiltX = 0;
let tiltY = 0;

// iOS motion permission
function enableMotion() {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(response => {
      if (response === 'granted') {
        window.addEventListener('deviceorientation', handleTilt, true);
        document.getElementById('permission').style.display = 'none';
      }
    });
  } else {
    window.addEventListener('deviceorientation', handleTilt, true);
    document.getElementById('permission').style.display = 'none';
  }
}
document.getElementById('permission').style.display = 'block';
document.getElementById('permission').addEventListener('click', enableMotion);

// Read gyro data
function handleTilt(event) {
  targetTiltX = event.gamma || 0; // side-to-side
  targetTiltY = event.beta || 0;  // front-to-back
}

// Simulated water-like wave points
const waveCount = 80;
let points = new Array(waveCount).fill().map((_, i) => ({
  x: (canvas.width / (waveCount - 1)) * i,
  y: canvas.height / 2,
  baseY: canvas.height / 2,
  velocity: 0
}));

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Smooth tilting
  tiltX += (targetTiltX - tiltX) * 0.05;
  tiltY += (targetTiltY - tiltY) * 0.05;

  // Update points
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    const dx = (i - waveCount / 2) / waveCount;

    const force = tiltX * dx * 0.5 + tiltY * 0.3;
    p.velocity += force - (p.y - p.baseY) * 0.05;
    p.velocity *= 0.9; // damping
    p.y += p.velocity;
  }

  // Draw wavy line
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length - 1; i++) {
    const p1 = points[i];
    const p2 = points[i + 1];
    const cx = (p1.x + p2.x) / 2;
    const cy = (p1.y + p2.y) / 2;
    ctx.quadraticCurveTo(p1.x, p1.y, cx, cy);
  }
  ctx.lineTo(canvas.width, canvas.height);
  ctx.lineTo(0, canvas.height);
  ctx.closePath();

  const hue = (Date.now() / 30) % 360;
  ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
  ctx.fill();

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
