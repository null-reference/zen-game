<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gyro Collision Game</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
    #permission {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #222;
      color: white;
      padding: 20px 30px;
      border-radius: 12px;
      font-family: sans-serif;
      display: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="permission">Tap to enable motion</div>
<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let targetTiltX = 0;
let targetTiltY = 0;
let tiltX = 0;
let tiltY = 0;

// iOS permission handling
function enableMotion() {
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission().then(response => {
      if (response === "granted") {
        window.addEventListener("deviceorientation", handleTilt, true);
        document.getElementById("permission").style.display = "none";
      }
    });
  } else {
    window.addEventListener("deviceorientation", handleTilt, true);
    document.getElementById("permission").style.display = "none";
  }
}
document.getElementById("permission").style.display = "block";
document.getElementById("permission").addEventListener("click", enableMotion);

function handleTilt(e) {
  targetTiltX = e.gamma || 0;
  targetTiltY = e.beta || 0;
}

let player = {
  x: canvas.width / 2,
  y: canvas.height / 2,
  radius: 12,
  baseRadius: 12,
  color: "white",
  collided: false,
  collisionTimer: 0
};

let obstacles = Array.from({ length: 20 }).map(() => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  r: 10 + Math.random() * 10,
  dx: -1 + Math.random() * 2,
  dy: -1 + Math.random() * 2,
  color: `hsl(${Math.random() * 360}, 80%, 60%)`
}));

function checkCollision(p, o) {
  const dx = p.x - o.x;
  const dy = p.y - o.y;
  const distance = Math.sqrt(dx * dx + dy * dy);
  return distance < p.radius + o.r;
}

function update() {
  // Smooth tilt motion
  tiltX += (targetTiltX - tiltX) * 0.1;
  tiltY += (targetTiltY - tiltY) * 0.1;

  player.x += tiltX * 0.5;
  player.y += tiltY * 0.5;

  // Clamp to screen
  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

  // Move obstacles
  for (let o of obstacles) {
    o.x += o.dx;
    o.y += o.dy;
    if (o.x < 0 || o.x > canvas.width) o.dx *= -1;
    if (o.y < 0 || o.y > canvas.height) o.dy *= -1;

    if (checkCollision(player, o)) {
      player.collided = true;
      player.collisionTimer = 10;
    }
  }

  if (player.collisionTimer > 0) {
    player.collisionTimer--;
    player.radius = player.baseRadius + 4 * Math.sin(player.collisionTimer * 0.5);
    player.color = "red";
  } else {
    player.collided = false;
    player.radius = player.baseRadius;
    player.color = "white";
  }
}

function draw() {
  // Flash red background if in collision
  if (player.collided) {
    ctx.fillStyle = "rgba(255, 0, 0, 0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // Obstacles
  for (let o of obstacles) {
    ctx.beginPath();
    ctx.fillStyle = o.color;
    ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Player
  ctx.beginPath();
  ctx.fillStyle = player.color;
  ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
  ctx.fill();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
