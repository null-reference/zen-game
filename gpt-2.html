<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Head-On Catch Game</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      height: 100%;
      background: black;
    }
    canvas {
      display: block;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: sans-serif;
      font-size: 20px;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>
<div id="score">Score: 0</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const center = { x: canvas.width / 2, y: canvas.height / 2 };
let score = 0;

class Ball {
  constructor() {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * 150 + 100;
    this.endX = center.x + Math.cos(angle) * radius;
    this.endY = center.y + Math.sin(angle) * radius;

    this.progress = 0; // 0 to 1
    this.radius = 5;
    this.maxRadius = 60;
    this.speed = 0.0015 + Math.random() * 0.001;

    this.trail = [];
  }

  update(delta) {
    this.progress += this.speed * delta;
    if (this.progress > 1) return false;

    const t = this.progress;
    this.x = center.x + (this.endX - center.x) * t;
    this.y = center.y + (this.endY - center.y) * t;
    this.radius = 5 + (this.maxRadius - 5) * t;

    this.trail.push({ x: this.x, y: this.y, radius: this.radius });
    if (this.trail.length > 20) this.trail.shift();

    return true;
  }

  draw(ctx) {
    for (let i = 0; i < this.trail.length; i++) {
      const p = this.trail[i];
      const alpha = i / this.trail.length;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,255,0,${alpha * 0.5})`;
      ctx.fill();
    }

    // Main ball
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = 'lime';
    ctx.fill();
  }

  isClicked(x, y) {
    const dx = x - this.x;
    const dy = y - this.y;
    return Math.sqrt(dx * dx + dy * dy) <= this.radius;
  }
}

let ball = new Ball();
let lastTime = 0;

function gameLoop(time) {
  const delta = time - lastTime;
  lastTime = time;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (ball) {
    const alive = ball.update(delta);
    ball.draw(ctx);
    if (!alive) {
      ball = new Ball(); // missed it
    }
  }

  requestAnimationFrame(gameLoop);
}

canvas.addEventListener('click', (e) => {
  if (ball && ball.isClicked(e.clientX, e.clientY)) {
    score++;
    document.getElementById('score').innerText = `Score: ${score}`;
    ball = new Ball(); // reset ball
  }
});

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
