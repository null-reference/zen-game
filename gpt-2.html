<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trippy Gyro Wave</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
    #permission {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 30px;
      background: #111;
      color: white;
      font-size: 18px;
      font-family: sans-serif;
      border: 1px solid #444;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>
<body>
<canvas id="waveCanvas"></canvas>
<div id="permission">Tap to enable motion access</div>
<script>
const canvas = document.getElementById('waveCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let tilt = 0;

// Request permission on iOS
function enableMotion() {
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(response => {
      if (response === 'granted') {
        window.addEventListener('deviceorientation', handleTilt, true);
        document.getElementById('permission').style.display = 'none';
      }
    });
  } else {
    window.addEventListener('deviceorientation', handleTilt, true);
    document.getElementById('permission').style.display = 'none';
  }
}

function handleTilt(event) {
  tilt = event.gamma || 0; // -90 to 90 degrees side-to-side
}

document.body.addEventListener('click', enableMotion);
document.getElementById('permission').style.display = 'block';

let time = 0;
function drawWave() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  time += 0.02;

  const amplitude = 40;
  const freq = 0.03;
  const offset = tilt * 0.05;

  for (let y = 0; y < canvas.height; y += 5) {
    ctx.beginPath();
    for (let x = 0; x < canvas.width; x += 10) {
      const wave = Math.sin((x + time * 100 + y * 0.5) * freq + offset) * amplitude;
      const px = x;
      const py = y + wave;
      ctx.lineTo(px, py);
    }
    const hue = (time * 40 + y) % 360;
    ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
    ctx.stroke();
  }

  requestAnimationFrame(drawWave);
}

drawWave();
</script>
</body>
</html>
