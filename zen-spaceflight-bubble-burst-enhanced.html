<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Spaceflight - Bubble Burst</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            overflow: hidden;
            font-family: monospace;
            cursor: none;
        }

        #gameCanvas {
            display: block;
            background: transparent;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #87ceeb;
            font-size: 20px;
            text-shadow: 0 0 20px rgba(135, 206, 235, 0.8);
            z-index: 100;
            font-weight: 400;
        }

        .ui div {
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards;
        }

        .ui div:nth-child(1) { animation-delay: 0.5s; }
        .ui div:nth-child(2) { animation-delay: 0.7s; }
        .ui div:nth-child(3) { animation-delay: 0.9s; }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        .combo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 30px currentColor;
            pointer-events: none;
            opacity: 0;
        }

        .combo.show {
            animation: comboAnim 1.5s ease-out;
        }

        @keyframes comboAnim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #87ceeb;
            text-align: center;
            font-size: 14px;
            opacity: 0.8;
            animation: fadeIn 2s ease-out;
        }

        .mobile-instructions {
            display: none;
        }

        .power-bar {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 10px;
            background: rgba(135, 206, 235, 0.2);
            border: 1px solid #87ceeb;
            border-radius: 5px;
            overflow: hidden;
        }

        .power-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #87ceeb);
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px currentColor;
        }

        @media (max-width: 768px) {
            .instructions .desktop-only {
                display: none;
            }
            .mobile-instructions {
                display: inline;
            }
            .ui {
                font-size: 16px;
            }
        }

        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid #87ceeb;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transition: transform 0.1s ease;
            box-shadow: 0 0 10px rgba(135, 206, 235, 0.8);
        }

        .custom-cursor::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 4px;
            background-color: #87ceeb;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="stars" id="starField"></div>
    <canvas id="gameCanvas"></canvas>
    
    <div class="ui">
        <div>Score: <span id="score">0</span></div>
        <div>Bubbles: <span id="bubblesBurst">0</span></div>
        <div>Combo: <span id="combo">x1</span></div>
    </div>
    
    <div class="combo" id="comboText"></div>
    
    <div class="power-bar">
        <div class="power-fill" id="powerFill"></div>
    </div>
    
    <div class="instructions">
        <span class="desktop-only">Move: WASD or Arrow Keys | Shoot: Spacebar or Click | Special: Hold Shift</span>
        <span class="mobile-instructions">Tilt device or drag to move | Tap to shoot | Double tap for special</span>
        <br>Relax and enjoy the zen
    </div>
    
    <div class="custom-cursor" id="cursor"></div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const cursor = document.getElementById('cursor');
        
        // Set canvas size
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Game state
        let score = 0;
        let bubblesBurst = 0;
        let combo = 1;
        let comboTimer = 0;
        let powerLevel = 0;
        let gameRunning = true;
        let specialActive = false;
        let screenShake = 0;
        
        // Player spaceship
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 40,
            height: 60,
            speed: 5,
            color: '#87ceeb',
            trail: [],
            rotation: 0,
            enginePulse: 0
        };
        
        // Arrays for game objects
        const bullets = [];
        const bubbles = [];
        const particles = [];
        const powerUps = [];
        const nebulaClouds = [];
        
        // Sound effects (using Web Audio API)
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(frequency, duration, type = 'sine') {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = type;
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }
        
        // Input handling
        const keys = {};
        let mouseX = 0;
        let mouseY = 0;
        let gyroX = 0;
        let gyroY = 0;
        let isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        let gyroSupported = false;
        
        // Hide/show custom cursor
        if (!isMobile) {
            document.addEventListener('mousemove', (e) => {
                cursor.style.left = e.clientX + 'px';
                cursor.style.top = e.clientY + 'px';
                cursor.style.display = 'block';
                mouseX = e.clientX;
                mouseY = e.clientY;
            });
            
            document.addEventListener('mouseleave', () => {
                cursor.style.display = 'none';
            });
        } else {
            cursor.style.display = 'none';
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.code === 'Space') {
                e.preventDefault();
                shootBullet();
            }
            if (e.key === 'Shift') {
                specialActive = true;
            }
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
            if (e.key === 'Shift') {
                specialActive = false;
            }
        });
        
        document.addEventListener('click', () => {
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            shootBullet();
        });
        
        // Touch controls for mobile
        let lastTapTime = 0;
        document.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTapTime;
            
            if (tapLength < 300 && tapLength > 0) {
                // Double tap for special
                specialActive = true;
                setTimeout(() => specialActive = false, 500);
            } else {
                shootBullet();
            }
            
            lastTapTime = currentTime;
        });
        
        // Mobile gyroscope controls (same as original)
        function requestGyroPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            enableGyroControls();
                        } else {
                            enableTouchControls();
                        }
                    })
                    .catch(error => {
                        enableTouchControls();
                    });
            } else {
                enableGyroControls();
            }
        }
        
        function enableGyroControls() {
            gyroSupported = true;
            window.addEventListener('deviceorientation', handleOrientation, true);
            
            setTimeout(() => {
                if (gyroX === 0 && gyroY === 0) {
                    enableTouchControls();
                }
            }, 3000);
        }
        
        function handleOrientation(e) {
            if (e.gamma !== null && e.beta !== null) {
                gyroX = Math.max(-1, Math.min(1, e.gamma / 30));
                let adjustedBeta = e.beta;
                if (adjustedBeta > 90) adjustedBeta = adjustedBeta - 180;
                gyroY = Math.max(-1, Math.min(1, adjustedBeta / 30));
            }
        }
        
        let touchStartX = 0;
        let touchStartY = 0;
        let touchDragging = false;
        
        function enableTouchControls() {
            document.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    touchDragging = true;
                }
            });
            
            document.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (touchDragging && e.touches.length === 1) {
                    const deltaX = e.touches[0].clientX - touchStartX;
                    const deltaY = e.touches[0].clientY - touchStartY;
                    gyroX = Math.max(-1, Math.min(1, deltaX / 100));
                    gyroY = Math.max(-1, Math.min(1, deltaY / 100));
                }
            });
            
            document.addEventListener('touchend', () => {
                touchDragging = false;
                gyroX = 0;
                gyroY = 0;
            });
        }
        
        if (isMobile) {
            document.addEventListener('touchstart', function initMobile() {
                document.removeEventListener('touchstart', initMobile);
                requestGyroPermission();
            }, { once: true });
            
            if (!navigator.userAgent.includes('iPhone') && !navigator.userAgent.includes('iPad')) {
                setTimeout(requestGyroPermission, 500);
            }
        }
        
        // Create enhanced starfield
        function createStars() {
            const starField = document.getElementById('starField');
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                const size = Math.random() * 3 + 0.5;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                starField.appendChild(star);
            }
        }
        
        // Create nebula clouds
        function createNebula() {
            for (let i = 0; i < 3; i++) {
                nebulaClouds.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 200 + 100,
                    color: `hsla(${Math.random() * 60 + 240}, 70%, 50%, 0.1)`,
                    drift: Math.random() * 0.5 - 0.25
                });
            }
        }
        
        // Bullet creation with special mode
        function shootBullet() {
            const bulletCount = specialActive && powerLevel > 20 ? 3 : 1;
            const spread = specialActive ? 15 : 0;
            
            for (let i = 0; i < bulletCount; i++) {
                const angle = (i - (bulletCount - 1) / 2) * spread * Math.PI / 180;
                bullets.push({
                    x: player.x + player.width / 2,
                    y: player.y,
                    width: specialActive ? 6 : 4,
                    height: specialActive ? 16 : 12,
                    speed: specialActive ? 12 : 8,
                    vx: Math.sin(angle) * 8,
                    vy: -Math.cos(angle) * 8,
                    color: specialActive ? '#ff00ff' : '#00ff88',
                    special: specialActive
                });
            }
            
            playSound(specialActive ? 440 : 330, 0.1);
            
            if (specialActive) {
                powerLevel = Math.max(0, powerLevel - 20);
            }
        }
        
        // Enhanced bubble creation
        function createBubble() {
            const size = Math.random() * 50 + 30;
            const type = Math.random() < 0.9 ? 'normal' : 'special';
            bubbles.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                size: size,
                speed: Math.random() * 2 + 1,
                wobble: Math.random() * Math.PI * 2,
                wobbleSpeed: Math.random() * 0.05 + 0.02,
                color: type === 'special' ? '#ffd700' : `hsl(${Math.random() * 360}, 70%, 60%)`,
                shimmer: 0,
                alpha: 0.8,
                type: type,
                health: type === 'special' ? 3 : 1
            });
        }
        
        // Power-up creation
        function createPowerUp(x, y) {
            powerUps.push({
                x: x,
                y: y,
                size: 20,
                speed: 1,
                type: 'power',
                pulse: 0
            });
        }
        
        // Enhanced particle effects
        function createParticles(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * (Math.random() * 4 + 2),
                    vy: Math.sin(angle) * (Math.random() * 4 + 2),
                    size: Math.random() * 5 + 3,
                    color: color,
                    life: 1,
                    decay: Math.random() * 0.02 + 0.01,
                    trail: []
                });
            }
        }
        
        // Screen shake effect
        function addScreenShake(amount) {
            screenShake = Math.min(screenShake + amount, 15);
        }
        
        // Update game state
        function update() {
            if (!gameRunning) return;
            
            // Update player position
            let dx = 0, dy = 0;
            
            if (keys['a'] || keys['arrowleft']) dx -= player.speed;
            if (keys['d'] || keys['arrowright']) dx += player.speed;
            if (keys['w'] || keys['arrowup']) dy -= player.speed;
            if (keys['s'] || keys['arrowdown']) dy += player.speed;
            
            // Mobile controls
            if (isMobile) {
                dx += gyroX * player.speed * 1.5;
                dy += gyroY * player.speed * 1.2;
            }
            
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x + dx));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y + dy));
            
            // Update player trail
            player.trail.push({ x: player.x + player.width / 2, y: player.y + player.height });
            if (player.trail.length > 10) player.trail.shift();
            
            // Update player rotation based on movement
            if (dx !== 0) {
                player.rotation = dx * 0.02;
            } else {
                player.rotation *= 0.9;
            }
            
            // Update engine pulse
            player.enginePulse = (player.enginePulse + 0.2) % (Math.PI * 2);
            
            // Update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                
                if (bullet.special) {
                    bullet.vx *= 0.98;
                }
                
                if (bullet.y < 0 || bullet.x < 0 || bullet.x > canvas.width) {
                    bullets.splice(i, 1);
                }
            }
            
            // Update bubbles
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const bubble = bubbles[i];
                bubble.y += bubble.speed;
                bubble.wobble += bubble.wobbleSpeed;
                bubble.x += Math.sin(bubble.wobble) * 0.5;
                bubble.shimmer += 0.1;
                
                if (bubble.y > canvas.height) {
                    bubbles.splice(i, 1);
                    combo = 1; // Reset combo if bubble escapes
                }
            }
            
            // Update power-ups
            for (let i = powerUps.length - 1; i >= 0; i--) {
                const powerUp = powerUps[i];
                powerUp.y += powerUp.speed;
                powerUp.pulse += 0.1;
                
                // Check player collection
                const dx = (player.x + player.width / 2) - powerUp.x;
                const dy = (player.y + player.height / 2) - powerUp.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 30) {
                    powerLevel = Math.min(100, powerLevel + 25);
                    powerUps.splice(i, 1);
                    playSound(880, 0.2);
                    createParticles(powerUp.x, powerUp.y, '#ffd700',
